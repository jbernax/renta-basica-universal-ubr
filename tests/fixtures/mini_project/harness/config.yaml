plan:
  required_sections:
    - Why this matters
    - Research questions
    - State of knowledge
    - Spain context & data sources
    - Methods & identification
    - Pilot implications
    - Risks, counterarguments & open issues
    - Deliverables & effort
  min_research_questions: 1
  always_locked: [decisions.md]

cycle:
  iterations_per_checkpoint: 3
  max_changes_per_iteration: 15

reviewers:
  panel: [alpha-expert, beta-expert, gamma-expert, delta-expert, red-team]
  always_include: [red-team]
  rotation: 3
  full_panel_every: 3
  first_iteration_full_panel: true

stopping:
  sota_weighted_min: 4.3
  sota_criterion_min: 4.0
  plateau_delta: 0.1
  plateau_window: 2
  min_verified_sources_ratio: 0.9
  min_coverage: 1.0
  regression_alert: -0.2

sources:
  timeout_seconds: 5
  user_agent: "ubr-test"
