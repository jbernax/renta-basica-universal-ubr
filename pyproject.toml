[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ubr-harness"
version = "0.1.0"
description = "Self-improvement harness for the Universal Basic Rent (Spain) research plan"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "jsonschema>=4.20", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ubr = "ubr.cli:main"

[tool.setuptools.packages.find]
where = ["harness"]
include = ["ubr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["harness"]
addopts = "-q"
