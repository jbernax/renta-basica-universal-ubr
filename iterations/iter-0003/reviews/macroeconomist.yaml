- id: MA-03-04
  severity: major
  module: M04
  finding: M04 acknowledges "dual external leakage" in Section 5 but treats it purely as a demand multiplier
    discount, ignoring the dynamic stock-flow consequences on Spain Balance of Payments, Net International
    Investment Position (NIIP), and the EU Macroeconomic Imbalance Procedure (MIP). Spanish low-income
    households exhibit a high marginal import propensity (28-35% in energy, imported food, clothing, and
    consumer durables per INE Input-Output and EPF tables). Simultaneously, widespread enterprise adoption
    of generative and agentic AI requires large outbound royalty, software license, and cloud compute
    payments to foreign-domiciled hyperscalers (M16). In aggregate, this dual leakage expands imports
    by 2.5-4.0% of GDP across S2 and S3, which threatens to reverse Spain external current account balance
    (currently +2.5% of GDP) into structural deficit and derail the post-2012 deleveraging of Spain NIIP
    (currently ~-50% of GDP). Under Regulation (EU) No 1176/2011, persistent current account deficits
    exceeding -4% of GDP or failure to converge toward the -35% NIIP threshold trigger formal MIP surveillance
    and financial penalties.
  proposal: 'Incorporate Balance of Payments stock-flow dynamics and external balance constraints into
    M04 and M16: (1) introduce an explicit external asset accumulation law of motion tracking Spain NIIP:
    d(NIIP)/dt = CA_t + Valuation_t, calibrating the trajectory under S1-S3; (2) quantify marginal import
    propensities by COICOP category and Figaro NACE input-output sectors for UBR recipients versus top-bracket
    taxpayers; and (3) benchmark the external accounts trajectory against the EU Macroeconomic Imbalance
    Procedure (MIP) scoreboard (Regulation No 1176/2011), proving that destination-based digital levies
    (M16) and domestic renewable energy substitution safeguard the current account surplus.'
  sources:
  - title: Regulation (EU) No 1176/2011 on the prevention and correction of macroeconomic imbalances
    authors:
