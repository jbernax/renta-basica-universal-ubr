- id: MA-03-03
  severity: major
  module: M04
  finding: 'M04 RQ-M04-02 assumes that Spanish 10-year sovereign bond spreads will remain bounded (<=
    85 bps) by formally netting gross UBR outlays against Discretionary Revenue Measures (MDI) in the
    annual Stability Programme. This overlooks three critical Eurozone fiscal-monetary governance constraints:
    (i) the Control Account (cuenta de control) established under Article 21(2) of Regulation (EU) 2024/1263,
    which mandates the opening of an Excessive Deficit Procedure (EDP) if net expenditure deviations exceed
    0.3% of GDP annually or 0.6% of GDP cumulatively—thresholds easily breached by initial UBR take-up
    dynamics or tax revenue implementation lags; (ii) the non-linear sovereign risk premium function,
    which penalizes public expenditure surges (gross public spending rising from 47% to ~65-70% of GDP)
    during periods of global financial tightening; and (iii) the strict eligibility criteria of the ECB
    Transmission Protection Instrument (TPI), which requires full compliance with EU fiscal rules, absence
    of an EDP, and sustainable public debt paths. A breach of the net expenditure ceiling would forfeit
    ECB TPI eligibility, exposing Spanish sovereign debt to self-fulfilling market selloffs.'
  proposal: 'Expand M04 Sections 2, 5, and 7 to: (1) formalize an endogenous sovereign spread pricing
    equation linking 10-year Bonos-Bund yield differentials to Debt Sustainability Analysis (DSA) debt-trajectory
    fan charts, primary balances, and an indicator for EDP activation; (2) model the Regulation (EU) 2024/1263
    Control Account debit trajectory, specifying an operational pre-funded fiscal escrow buffer (>= 0.2%
    of GDP) to prevent cumulative debits from reaching the 0.6% of GDP EDP trigger; and (3) embed ECB
    TPI compliance criteria into M04 institutional macro risk matrix, establishing that the UBR fiscal
    trajectory maintains unconditional TPI eligibility under adverse market spread shocks.'
