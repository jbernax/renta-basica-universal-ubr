- id: MA-03-02
  severity: critical
  module: M04
  finding: 'M04 specifies a two-sector open-economy HANK model but relies on an unsubstantiated hypothesis
    (RQ-M04-01) that digital AI marginal-cost reductions in tradables will counterbalance high-MPC non-tradable
    demand inflation. In a small open economy within a monetary union with a fixed nominal exchange rate,
    non-homothetic household demand directs UBR liquidity predominantly toward domestic non-tradables
    (housing, hospitality, care, personal services). Simultaneously, UBR raises worker reservation wages
    in low-wage service sectors (M08). Because physical domestic services cannot be automated by foundation
    models (Baumol cost disease), Sector N experiences an acute demand-and-cost inflation shock. Digital
    goods deflation in Sector T cannot neutralize this non-tradable price pressure because tradables and
    non-tradables are imperfect substitutes (sigma_{T,N} < 1). Furthermore, M04 fails to model the destabilizing
    Walters real-interest-rate channel: higher Spanish domestic inflation lowers real borrowing rates
    (r_t^{ES} = i_t^{ECB} - pi_t^{ES} < r_t^*), inducing pro-cyclical credit expansion and real exchange
    rate appreciation (RER_t = P_t / P_t^* > 1) that erodes tradable competitiveness before terms-of-trade
    adjustment can stabilize the macroeconomy.'
  proposal: 'Formalize the two-sector structural pricing and transmission equations in M04 Sections 2,
    3, and 5: (1) specify distinct New Keynesian Phillips Curves for Sector T (open to international competition
    and AI productivity gains) and Sector N (labor-intensive, non-tradable, with wage feedback from M08
    and Baumol cost dynamics); (2) calibrate the elasticity of substitution between tradable and non-tradable
    consumption (sigma_{T,N} in [0.5, 0.8]) using EPF microdata, proving whether relative price shifts
    ignite headline CPI inflation above the ECB target; and (3) model the dynamic interaction between
    the pro-cyclical Walters real-rate channel and the counter-cyclical terms-of-trade competitiveness
    channel, identifying macroprudential and fiscal reserve requirements necessary to guarantee dynamic
    macroeconomic stability.'
