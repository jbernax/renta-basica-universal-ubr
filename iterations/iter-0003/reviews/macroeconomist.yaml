- id: MA-03-05
  severity: major
  module: M17
  finding: "M17 state-contingent roadmap relies on the composite displacement index I_{AI,t} = \\omega_1\
    \ \\Delta \tilde{s}_{L,t} + \\omega_2 u_{cognitive,t} + \\omega_3 (\\Delta EBE_{tech,t}/GDP_t) to\
    \ trigger statutory Phase step-ups (from Tier A to Tier B and Tier C). However, M17 lacks an explicit\
    \ business-cycle filtering mechanism: cyclical recessions, terms-of-trade shocks, or temporary profit\
    \ squeezes could distort labor shares and corporate margins, risking false-positive irreversible step-ups\
    \ into permanent Tier B or Tier C commitments during cyclical downturns when public revenues are cyclically\
    \ depressed. Furthermore, while M17 defines short-run tax and housing circuit-breakers, it fails to\
    \ specify an orderly legal and macroeconomic reversal protocol if compound tail-risk crises (Stress\
    \ 1-4) threaten debt sustainability. Because nominal benefit cuts face formidable constitutional and\
    \ political barriers under Art. 41 CE, and emergency high-bracket IRPF surcharges fail if top ETI\
    \ doubles (Stress 2: e = 0.50), the plan lacks an explicit statutory Indexation Suspension Protocol\
    \ that decouples UBR from CPI inflation to restore fiscal balance without violating social rights."
  proposal: 'Strengthen M17 Sections 2, 5, and 7 to: (1) mandate an AIReF cyclical filtering protocol
    requiring that I_{AI,t} be evaluated over an 8-quarter rolling window and conditioned on an AIReF-certified
    output gap within \pm 1.5% of potential GDP (barring phase step-ups during cyclical downturns); and
    (2) establish a statutory Indexation Suspension Protocol under Ley 2/2015 de desindexación de la economía
    española as the ultimate macro-fiscal backstop, whereby if the Regulation 2024/1263 Control Account
    debit reaches 0.5% of GDP or 10-year Bonos-Bund spreads exceed 150 bps, nominal UBR benefit adjustments
    are legally frozen (yielding a 2-4% real fiscal adjustment per year through inflation) until structural
    primary balance is restored.'
