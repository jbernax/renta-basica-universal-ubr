- id: LW-03-03
  severity: major
  module: M12
  finding: 'M12 exhibits two serious administrative and procedural law defects: (1) In Section 4 (line 33) and Section 5.2
    (line 43), M12 repeatedly cites "Ley 39/2015 del Procedimiento Administrativo Común (LPAC Art. 41)" as the statutory governance
    framework for automated administrative acts (actuaciones administrativas automatizadas) and algorithmic due process. This
    is a severe statutory misattribution: Article 41 of Ley 39/2015 governs administrative notifications (notificaciones en
    papel y electrónicas). The actual statute governing automated administrative acts in Spanish public law is Article 41
    of Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público (LRJSP, BOE-A-2015-10566). Under Art. 41.2 LRJSP,
    automated administrative processing legally requires: (a) formal pre-determination of the competent administrative organs
    responsible for system specifications, programming, maintenance, supervision, and algorithmic source-code auditing; and
    (b) clear designation of the organ responsible for administrative appeals. Furthermore, the procedural right to a 30-day
    non-suspensive hearing belongs under Article 82 of Ley 39/2015 (LPAC), not Art. 41. (2) In Section 2 (line 21) and Section
    5.2 (line 42), M12 establishes an absolute statutory shield against debt attachment (inembargabilidad) under Art. 607
    LEC and Art. 44 TRLGSS. However, M12 completely omits Article 608 of the Ley de Enjuiciamiento Civil (LEC, Ley 1/2000,
    BOE-A-2000-323), which establishes a mandatory, constitutionally protected exception: debt attachment limitations do NOT
    apply when executing court judgments for child support and alimony (pensiones por alimentos a favor de los hijos). Granting
    UBR absolute inembargabilidad without an Art. 608 LEC child support carve-out would unlawfully shield child maintenance
    defaulters, directly violating the constitutional principle of child protection (Art. 39 CE) and the UN Convention on
    the Rights of the Child.'
  proposal: 'Revise M12 to: (1) correct all administrative statutory citations by anchoring automated UBR disbursements and
    withholding adjustments in Article 41 of Ley 40/2015 (LRJSP), detailing the formal institutional responsibilities for
    software specification, algorithmic source-code auditing, and legal accountability, while anchoring prior hearing guarantees
    before payment suspension in Article 82 of Ley 39/2015 (LPAC); (2) amend the inembargabilidad protocol to explicitly incorporate
    the Article 608 LEC child support exception, permitting judicial embargoes strictly for court-mandated child maintenance
    while retaining absolute protection against commercial bank overdraft set-offs, consumer credit seizures, and administrative
    tax compensations under Arts. 71–73 LGT; and (3) add verified entries for Ley 40/2015 (LRJSP) and Ley 1/2000 (LEC) to
    sources.yaml.'
