- id: LW-03-02
  severity: critical
  module: M07
  finding: 'M07 Section 5.1 (Tier 2) introduces a severe Social Security contributory hazard and equity gap: (1) It defines
    the Dual-Pillar integration for contributory unemployment insurance (SEPE) as paying max(0, B_contrib - UBR). Under Article
    273.2 of the Texto Refundido de la Ley General de la Seguridad Social (TRLGSS, BOE-A-2015-11724), during contributory
    unemployment entitlement, the public employment service (SEPE) pays the employer''s Social Security retirement contribution
    (cotización por jubilación) based on the worker''s average prior contribution base. If the SEPE cash benefit is offset
    down to zero by UBR—which occurs for the vast majority of displaced workers whose previous regulatory base was below ~€1,400–€1,600/month—SEPE''s
    statutory contribution obligation is extinguished. Because UBR is a universal non-contributory cash transfer that does
    not generate Social Security pension contributions, unemployed workers would incur extensive contribution gaps (lagunas
    de cotización, Art. 209 TRLGSS). Under Spanish pension rules, contribution gaps severely depress the regulatory base for
    future retirement pensions (integrated at only the minimum base for 48 months and 50% thereafter), breaching the No-Loser
    Guarantee for displaced workers. (2) Tier 3 replaces non-contributory invalidity PNC with the Universal Disability Supplement,
    but completely ignores contributory permanent disability pensions (Incapacidad Permanente Total, Absoluta, and Gran Invalidez,
    Arts. 193–200 TRLGSS). Under Art. 7.f of Ley 35/2006 (LIRPF), contributory pensions for Incapacidad Permanente Absoluta
    and Gran Invalidez are 100% tax-exempt. Subjecting these severely incapacitated workers to M03''s reformed 38–52% IRPF
    schedule without an explicit statutory tax exemption or offsetting tax-shield credit would inflict devastating disposable
    income losses, violating Art. 49 CE and Art. 31.1 CE. (3) Tier 4 assumes regional minimum incomes are simply supplemented,
    failing to address that in 15 common-regime CCAA where regional benefits are subsidiary and lower than €900, regional
    governments will reap an uncoordinated windfall of €1.5B–€2.0B/year at State expense.'
  proposal: 'Amend M07 to: (1) codify an explicit statutory Contribution Continuity Guarantee (Garantía de Mantenimiento de
    Bases de Cotización por Desempleo) under Art. 273 TRLGSS, obligating SEPE to maintain and pay full Social Security retirement
    contribution bases throughout the contributory unemployment period, independent of whether the cash benefit is partially
    or wholly offset by UBR; (2) explicitly guarantee in Tier 2 and Tier 3 that contributory pensions for Incapacidad Permanente
    Absoluta and Gran Invalidez retain their complete statutory tax exemption under Art. 7.f of Ley 35/2006 (LIRPF), or receive
    an equivalent automatic refundable Complemento por Discapacidad Contributiva neutralizing all post-reform IRPF liability;
    and (3) establish a Common Regime Rebalancing Protocol in the CPFF to earmark the ~€1.5B–€2.0B regional savings from extinguished
    subsidiary minimum incomes into mandatory co-financing for municipal social housing (M05) and SAAD dependency care services
    under Ley 39/2006.'
