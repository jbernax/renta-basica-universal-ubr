reviewer: spanish-eu-law
iteration: 3
summary: 'Modules M06, M07, M12, and M13 have integrated important institutional foundations since Iteration 1 (incorporating
  STC 158/2021, STC 19/2024, Art. 280 TRLGSS pension credits for older workers, and three-tier pilot comparisons), but retain
  four critical constitutional, EU-law, and administrative-law vulnerabilities: (1) M06 commits a fundamental category error
  by applying the Foral concept of "carga no asumida" to the Common Regime financing system (Ley 22/2009 / LOFCA) and assumes
  centralized State AEAT payroll/tax administration nationwide, overlooking that the Basque and Navarrese Haciendas Forales
  hold exclusive IRPF jurisdiction under the Concierto Económico (Ley 12/2002); (2) M07 Tier 2 offsets contributory unemployment
  benefits (SEPE) down to UBR without maintaining the vital Social Security retirement contribution bases under Art. 273 TRLGSS,
  creating damaging contribution gaps (lagunas de cotización, Art. 209 TRLGSS) that permanently depress future retirement
  pensions, while Tier 3 omits contributory permanent disability pensions (Incapacidad Permanente Absoluta / Gran Invalidez),
  stripping them of their protected tax exemption under Art. 7.f LIRPF; (3) M12 misattributes automated administrative acts
  to Ley 39/2015 Art. 41 (which governs notifications) instead of Ley 40/2015 Art. 41 (LRJSP), and institutes an absolute
  inembargabilidad shield that unlawfully overrides the constitutionally mandated child-support alimony exception under Art.
  608 LEC and Art. 39 CE; and (4) M13 creates a severe EU free-movement dilemma under Art. 45 TFEU / Regulation 492/2011 regarding
  marginal part-time workers, while abolishing the IRPF mínimo personal without a default personal allowance for residents
  subject to waiting periods, unconstitutionally taxing subsistence income from the first euro in violation of Art. 31.1 CE
  and STC 214/1994.'
scores:
  spain_fit:
    score: 3.7
    rationale: 'Integrates landmark Tribunal Constitucional rulings (STC 158/2021 and STC 19/2024), Foral Economic Agreements
      (Ley 12/2002, Ley 28/1990), and three-tier pilot governance (D-005). However, it exhibits two major institutional flaws:
      it incorrectly applies the Foral Cupo concept of "carga no asumida" to the multilateral Common Regime under Ley 22/2009,
      and it assumes centralized AEAT execution for IRPF credits nationwide, ignoring that AEAT lacks jurisdiction in the
      Basque Country and Navarre where Haciendas Forales possess exclusive direct-taxation powers.'
  feasibility:
    score: 3.5
    rationale: 'Designs advanced administrative tools like the privacy-preserving Numerical Tax Code and public payment rails
      via Correos/Banco de España, but fails operational and statutory feasibility on three fronts: offsetting SEPE unemployment
      benefits without an Art. 273 TRLGSS retirement contribution bridge destroys pension continuity for displaced workers;
      absolute inembargabilidad violates Art. 608 LEC child support enforcement; and automated clearing lacks the programming,
      supervisory organ, and code auditing framework required by Art. 41 Ley 40/2015.'
  ethics_equity:
    score: 3.6
    rationale: 'Provides commendable equity protections through the Universal Disability Supplement (RD 888/2022) and the
      Single-Parent bonus (+€150–€200/month). However, two severe equity hazards remain: abolishing the IRPF mínimo personal
      leaves resident taxpayers in M13''s 24-month waiting period exposed to 38–52% taxation from their first euro of subsistence
      wages (violating Art. 31.1 CE and STC 214/1994), and contributory permanent disability pensions (Incapacidad Permanente
      Absoluta) lose their protected tax exemption under Art. 7.f LIRPF.'
  counterarguments:
    score: 3.5
    rationale: 'Engages political and macroeconomic counterarguments well, but leaves major legal vulnerabilities unaddressed:
      the EU CJEU "marginal worker" gateway under Art. 45 TFEU and Regulation 492/2011 (allowing part-time workers to claim
      full benefits immediately), the constitutional boundary of non-confiscatoriness under Art. 31.3 CE and STC 182/2021
      regarding Scenario S3''s AI surplus capture, and the lack of differentiation between public administration means-testing
      errors and fraudulent misrepresentation under LPAC / Ley 47/2003.'
  coverage:
    score: 3.8
    rationale: Achieves broad and detailed coverage across reference factors F07, F08, F13, and F14, with explicit disaggregation
      across Municipal, Regional (Común vs. Foral), and National pilot tiers. However, deeper cross-module harmonization is
      required between M06 (foral tax autonomy), M07 (contributory retirement pension continuity), M12 (LRJSP automated acts
      and LEC debt attachment), and M13 (EU worker status and mínimo existencial).
issues:
- id: LW-03-01
  severity: critical
  module: M06
  finding: M06 Section 5.1 and RQ-M06-01 exhibit a fundamental doctrinal and competence defect by conflating Foral and Common
    Regime fiscal federalism. First, M06 proposes amending "Ley 22/2009 and Foral Treaties classifying UBR as a carga no asumida".
    Under the Spanish Constitution and fiscal federalism statutes, the concept of "carga no asumida" (non-assumed State power)
    is strictly and exclusively a Foral mechanism under the Basque Concierto Económico (Ley 12/2002) and Navarre Convenio
    Económico (Ley 28/1990) used to determine the territorial Cupo (6.24%) and Aportación (1.6%). In the 15 Common Regime
    Autonomous Communities, "cargas no asumidas" do not exist; common-regime financing is strictly governed by LOFCA (Ley
    Orgánica 8/1980) and Ley 22/2009 through the Fondo de Garantía de Servicios Públicos Fundamentales (FGSPF) and Fondo de
    Suficiencia Global (FSG). Applying "carga no asumida" to Ley 22/2009 is a legal category error that leaves unaddressed
    how common-regime CCAA are compensated for the compression of their 50% ceded IRPF base and how the ~€1.5B–€2.0B windfall
    from extinguished regional minimum incomes is settled in the Consejo de Política Fiscal y Financiera (CPFF). Second, M06
    assumes centralized AEAT execution of the refundable IRPF credit and withholding codes nationwide, ignoring that the State
    AEAT has ZERO tax jurisdiction over personal income tax in Euskadi and Navarre. Under Ley 12/2002 and Ley 28/1990, the
    Diputaciones Forales (Álava, Bizkaia, Gipuzkoa) and Hacienda Foral de Navarra hold exclusive normative and management
    competence over IRPF. The State Cortes Generales cannot unilaterally modify foral IRPF withholdings or credits without
    bilateral statutory harmonization. Third, in Scenario S3, M06 invokes Art. 128.2 CE for sovereign AI funds without addressing
    the constitutional limits of non-confiscatoriness (Art. 31.3 CE, STC 182/2021) and protection of private enterprise (Art.
    38 CE).
  proposal: 'Restructure M06 to: (1) strictly bifurcate territorial financing mechanisms between the Foral regime (classifying
    UBR as a carga no asumida within the Comisión Mixta del Concierto and Comisión Coordinadora del Convenio) and the Common
    Regime (revising the Fondo de Suficiencia Global and negotiating an adjustment to ceded tax tranches under LOFCA Art.
    13 and Ley 22/2009 DA 2ª within the CPFF); (2) codify the bilateral tax harmonization mechanism under Article 6 of Ley
    12/2002 and Article 7 of Ley 28/1990, establishing model Normas Forales and Leyes Forales to be enacted by the Foral Parliaments
    (Juntas Generales and Parlamento de Navarra) to implement the refundable credit and withholding codes, coordinating with
    STC 19/2024 foral management of non-contributory transfers; (3) establish a constitutional doctrine for Scenario S3 AI
    rent capture distinguishing non-confiscatory excess-profit corporate automation levies from unconstitutional expropriation
    under Art. 31.3, 33, 38, and 128.2 CE, citing STC 182/2021; and (4) add verified citations for RDLeg 5/2004 (TRIRNR) and
    STC 182/2021.'
