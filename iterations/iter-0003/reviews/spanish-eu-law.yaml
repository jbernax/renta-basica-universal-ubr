- id: LW-03-04
  severity: critical
  module: M13
  finding: 'M13 contains two severe constitutional and EU-law vulnerabilities: (1) Under RQ-M13-02 and Section 5.1, M13 adopts
    a Tax-Benefit Symmetry architecture that grants immediate pro-rata UBR tax credits to "economically active residents subject
    to IRPF" from month one, while imposing a 24-month waiting period on "economically inactive" arrivals under Directive
    2004/38/EC Art. 24(2). However, under established CJEU jurisprudence (Case 53/81 Levin, Case 66/85 Lawrie-Blum, and Case
    C-14/09 Genc), the concept of "worker" under Article 45 TFEU is an autonomous European Union law definition that cannot
    be defined or restricted by national tax legislation. The CJEU consistently holds that any EU citizen performing effective
    and genuine work—even on a minimal part-time basis (e.g. 5–10 hours per week) or earning wages below the national subsistence
    floor—is legally an EU worker, entitled to complete equal treatment in all social and tax advantages under Article 7(2)
    of Regulation (EU) No 492/2011. M13 provides no criteria, hours thresholds, or pro-rata benefit formulas for marginal
    part-time workers: granting immediate full €900/month UBR to marginal workers creates an enormous cross-border welfare
    incentive ("mini-job gateway"), whereas denying worker status to part-time EU citizens would trigger immediate CJEU infringement
    proceedings under Art. 45 TFEU. (2) In M03, the research plan abolishes the IRPF personal allowance (mínimo personal y
    familiar, Arts. 56–61 Ley 35/2006). For any resident taxpayer subject to M13''s 24-month waiting period (such as inactive
    EU arrivals or third-country nationals with temporary residency), any modest income earned during those 24 months will
    be taxed from the very first euro at 38–52% without either a personal allowance or a UBR credit. Under landmark Tribunal
    Constitucional jurisprudence (STC 214/1994, STC 19/2012, and STC 182/2021), the principle of economic capacity (capacidad
    económica, Art. 31.1 CE) strictly prohibits taxing the untaxable subsistence minimum (mínimo existencial). Depriving waiting-period
    residents of both UBR and the tax-free subsistence allowance is blatantly unconstitutional.'
  proposal: 'Amend M13 to: (1) resolve the CJEU Art. 45 TFEU / Regulation 492/2011 dilemma by establishing a statutory definition
    of "effective and genuine employment" based on objective Social Security contribution thresholds (e.g. affiliation under
    Régimen General or RETA with minimum monthly earnings corresponding to at least 50% of the SMI or 20 hours/week), paired
    with a pro-rata tapering schedule for sub-threshold part-time EU workers that scales the UBR credit to working time to
    comply with EU non-discrimination while closing artificial welfare gateways; (2) codify a Default Non-Refundable Mínimo
    Personal y Familiar in Ley 35/2006 that remains active strictly for resident taxpayers temporarily excluded from UBR under
    statutory waiting periods, ensuring no individual''s subsistence income is ever taxed below the Art. 31.1 CE constitutional
    minimum existencial (STC 214/1994); (3) establish an unconditional child subsistence safe-harbor under Art. 39 CE, STC
    236/2007, and the UN Convention on the Rights of the Child ensuring minor dependents residing in Spain receive the child
    allowance regardless of parental residency duration; and (4) cite Regulation (EU) No 492/2011, Case 66/85 Lawrie-Blum,
    Case C-14/09 Genc, and STC 214/1994 in sources.yaml with verified URLs.'
