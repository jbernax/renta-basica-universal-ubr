- id: EM-03-02
  severity: critical
  module: M10
  finding: 'M10 Section 5.1 and METHODS Section 4 establish a cluster design of J = 70 clusters (35 treated, 35 control) in
    small municipalities (1,500–5,000 residents) with m approx 285 adults per cluster, claiming 80% statistical power (alpha
    = 0.05) to detect a 2.8% local rental pass-through differential (M05) and 1.2 h/week labor adjustment. This specification
    contains two fatal econometric disconnects: (1) The stated MDE formula is for a standard one-stage cluster RCT with binary
    treatment (P = 0.5). However, identifying general-equilibrium rental pass-through and wage spillovers requires a two-stage
    spatial saturation design (Baird et al. 2018; Egger et al. 2022) with multi-level cluster saturation proportions S_j in
    [0, 1]. In two-stage designs, the variance of the indirect spillover estimator is inflated by 1/Var(S_j) and depends on
    the number of untreated units in treated clusters. With only 35 treated clusters split across saturation tiers, cluster-level
    degrees of freedom under wild cluster bootstrap are severely insufficient; (2) In small Spanish municipalities (1,500–5,000
    residents), homeownership exceeds 75–80%, meaning market renters comprise only 15–20% of the population (~45–55 renters
    among m = 285 sampled adults). Under Spain’s Ley de Arrendamientos Urbanos (LAU Art. 9) and Ley 12/2023 por el Derecho
    a la Vivienda, mandatory lease terms are 5 years (7 for corporate landlords). Over a 36-month pilot, fewer than 25% of
    existing leases turnover. Consequently, each cluster will observe only ~10–15 new market rental contracts over 3 years
    in official bond-deposit registers (INCASÒL, AVRA, IVIMA). An effective sample size of 10–15 rental transactions per cluster
    with an intraclass correlation rho_rent = 0.08 is statistically powerless to detect a 2.8% rental pass-through differential.'
  proposal: 'In M10 (Sections 2, 5.1, 8), M05 (Section 5), and METHODS (Section 4): (1) Replace the naive cluster MDE formula
    with the formal Baird et al. (2018) two-stage randomized saturation variance equation, explicitly specifying direct (beta_direct)
    and indirect spillover (beta_indirect) MDEs across saturation bins S_j in {0, 0.33, 0.66, 1.0}; (2) Overhaul the housing
    evaluation sampling strategy: rather than relying on a small general-population sample (m = 285) in rural municipalities
    with low rental shares, purposively select urban/peri-urban clusters with rental shares >35% (or stratify clusters by
    rental density); (3) Mandate an administrative census linkage of 100% of municipal rental deposit records (fianzas de
    alquiler) registered in regional databases (INCASÒL, IVIMA, AVRA) across all treated and control clusters, rather than
    observing only sample participants; and (4) Pre-specify a Synthetic Difference-in-Differences (SDID, Arkhangelsky et al.
    2021) estimator comparing treated municipal rental price trajectories against non-treated matched synthetic controls.'
  sources:
