- id: EM-03-03
  severity: major
  module: M10
  finding: 'M10 (Section 4 and Section 5.3) and METHODS Section 4 propose continuous administrative microdata linkage to "Sistema
    Nacional de Salud (SNS) electronic clinical records (primary care consultations, psychotropic prescriptions, sick leave
    bajas IT)" via DNI/NIE and HMAC-SHA256 salted pseudonymization to eliminate health attrition and evaluate clinical outcomes
    (M14). This protocol overlooks the decentralized legal and administrative architecture of the Spanish healthcare system:
    (1) Under Title VIII of the Spanish Constitution and Ley 14/1986 General de Sanidad, healthcare delivery and electronic
    clinical records are completely devolved to the 17 Autonomous Communities. There is NO centralized national database containing
    patient-level clinical consultations or psychotropic prescription microdata for scientific linkage. The central Ministry
    of Health manages only the Base de Datos Clínicos de Atención Primaria (BDCAP), which is a pseudo-anonymized 1%–10% sample,
    capturing fewer than 10% of pilot participants; (2) Linking primary care visits and prescription microdata across participants
    in multiple autonomous communities requires executing separate bilateral agreements and securing ethical clearances from
    17 distinct regional Comités de Ética de la Investigación con medicamentos (CEIm); (3) Conversely, temporary disability
    records (bajas por Incapacidad Temporal, IT) are already centralized under the Instituto Nacional de la Seguridad Social
    (INSS). Conflating decentralized regional health services with a non-existent unified national SNS clinical register undermines
    the administrative feasibility and schedule of the pilot evaluation.'
  proposal: 'In M10 (Sections 4, 5, 8), M12 (Section 4), and METHODS Section 4: (1) Bifurcate the health evaluation architecture
    into a two-tier linkage protocol: Tier 1 (Centrally Feasible Administrative Health Spine) links INSS temporary disability
    (Incapacidad Temporal, IT) microdata directly via the centralized TGSS/INSS administrative data pipeline, providing complete,
    objective, daily-resolution tracking of psychiatric sick leaves (ICD-10 Chapter F codes), somatic diagnoses, and episode
    durations for 100% of participants; Tier 2 (Decentralized Regional Clinical Microdata) establishes formal bilateral data-access
    agreements specifically with the Regional Health Services of the pilot autonomous communities (e.g., CatSalut in Catalonia,
    SERMAS in Madrid, Osakidetza in the Basque Country) under Art. 53 of Ley 16/2003 de cohesión y calidad del SNS, budgeting
    6 months for regional CEIm clearances; and (2) Pre-specify the INSS IT registry as the primary preregistered objective
    health outcome, relegating regional EHR and psychotropic pharmacy claims to secondary exploratory analyses.'
  sources:
