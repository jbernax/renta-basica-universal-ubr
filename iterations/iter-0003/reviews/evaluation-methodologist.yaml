- id: EM-03-04
  severity: major
  module: M15
  finding: 'M15 Section 5.1 and METHODS Section 4 specify a life-cycle parameter transportability equation: Delta ln h_it
    = epsilon^Frisch Delta ln lambda_it + epsilon^c Delta ln w_it(1 - tau) + eta [G_pilot / (A_it + H_it) * (1 - (1+r)^(-T))
    / (1 - (1+r)^(-(T_ret - t)))]. This equation contains a fundamental structural specification error and an unaddressed
    labor-demand constraint: (1) In life-cycle labor supply theory (MaCurdy 1981; Blundell & MaCurdy 1999), the Frisch elasticity
    epsilon^Frisch is the elasticity of hours with respect to transitory wage changes holding the marginal utility of wealth
    lambda constant: epsilon^Frisch = [partial ln h_it / partial ln w_it]_lambda. Wealth changes (such as G_pilot) operate
    entirely through shifts in lambda_it (the income effect eta). Multiplying epsilon^Frisch by Delta ln lambda_it while attaching
    epsilon^c to the trial wage variation is mathematically backwards: in a 3-year trial, any clawback rate variation is transitory,
    meaning the observed substitution response identifies epsilon^Frisch, not epsilon^c; (2) The transportability framework
    presumes that workers operate along an unconstrained labor supply curve. In Spain’s segmented labor market disrupted by
    AI displacement scenarios S1–S3, millions of workers face involuntary job rationing, contract inactivity (pases a inactividad
    de fijos discontinuos), or underemployment. Transporting unconstrained trial elasticities to workers who are on the labor-demand
    boundary fundamentally biases microsimulation and macro projections.'
  proposal: 'In M15 (Sections 2, 5.1), M08 (Section 5.1), and METHODS Section 4: (1) Correct the structural life-cycle decomposition
    equation to canonical form: Delta ln h_it = epsilon^Frisch Delta ln w_it^transitory + epsilon^c Delta ln w_i^permanent
    + eta [G_pilot / (A_it + H_it) * (1 - (1+r)^(-T)) / (1 - (1+r)^(-(T_ret - t)))], explicitly noting that 3-year trial clawback
    variations identify epsilon^Frisch, from which the permanent compensated elasticity epsilon^c is recovered via the structural
    relation epsilon^c = epsilon^Frisch + eta * (w_i h_i) / (A_i + H_i) or empirical Chetty (2012) micro-macro bounds (epsilon^c
    / epsilon^Frisch in [0.4, 0.7]); and (2) Integrate a labor-demand rationing correction (Bargain, Orsini, & Peichl 2014)
    conditioning labor supply adjustments on involuntary displacement probabilities (P_disp,CNO-11 from M01) and involuntary
    part-time shares from EPA microdata, preventing unconstrained supply elasticities from overstating voluntary labor withdrawal
    under high-unemployment AI scenarios.'
  sources:
  - title: An Empirical Model of Labor Supply in a Life-Cycle Setting
