- id: LE-03-04
  severity: major
  module: M15
  finding: 'M15 formulates a life-cycle Frisch and windfall decomposition equation and a Bayesian hierarchical meta-analysis,
    but exhibits two major external-validity gaps: (1) it does not adjust Bayesian priors for macro labor-demand rationing
    across AI scenarios S1, S2, and S3 (D-006). In tight labor markets (like the US during OpenResearch), labor supply elasticities
    govern employment adjustments; under S2 and S3, severe displacement creates involuntary unemployment rationing where observed
    employment transitions are bounded by labor demand constraints rather than unconstrained supply preferences. (2) M15 overlooks
    Spain landmark domestic experimental evidence: the 34 randomized controlled trials (RCTs) deployed under the Ministry
    of Inclusion Policy Lab (supported by €212M in NextGenerationEU PRTR funds with technical coordination from CEMFI and
    J-PAL Europe). These 34 RCTs evaluated behavioral interventions, wage supplements, and conditionality directly on over
    76,000 Spanish IMV and vulnerable recipients, offering directly transportable domestic empirical priors.'
  proposal: 'In M15 Sections 2, 4, 5, and 7: (1) formalize a macro-rationing weighting function in the Bayesian meta-regression
    adjusting prior elasticities by local unemployment slack and labor-demand tightness (U/V ratio) across S1 (near-equilibrium),
    S2 (moderate rationing), and S3 (structural labor-demand rationing); (2) systematically incorporate findings, microdata
    registers, and treatment effect bounds from the 34 Ministry of Inclusion / CEMFI / J-PAL Policy Lab RCTs alongside B-MINCOME
    and Catalonia blueprints; (3) revise RQ-M15-01 and RQ-M15-02 to explicitly specify scenario-contingent elasticity bounds
    across S1–S3.'
  sources:
  - title: 'Laboratorio de Políticas de Inclusión: Ensayos Controlados Aleatorizados vinculados al Ingreso Mínimo Vital (Componente
      23 PRTR)'
    authors:
    - Secretaría General de Inclusión
    - CEMFI
    - J-PAL Europe
    year: 2024
    url: https://inclusion.cemfi.es/
- id: LE-03-05
  severity: major
  module: METHODS
  finding: In plan/methods.md Pillar 1 (and M01 Section 5), the Sequential Decomposition Protocol states that Step 1 applies
    macro Acemoglu-Restrepo displacement hazards to Contabilidad Nacional and MCVL across S1–S3, and Step 2 applies behavioral
    labor supply elasticities in EUROMOD. However, the protocol lacks an explicit microdata selection and assignment mechanism.
    In Spain highly segmented labor market, when an occupation FTE employment contracts (e.g. -20% in S2), job loss does not
    occur randomly across workers. Because Spanish employment protection legislation (Art. 56 Estatuto de los Trabajadores)
    mandates 33 days/year severance pay for unfair dismissal, firing costs rise steeply with worker tenure (antigüedad). Consequently,
    employers adjust via last-in-first-out (LIFO) dynamics, non-renewal of temporary contracts, pases a inactividad of fijos
    discontinuos, and hiring freezes. Allocating macro displacement randomly across micro-records in EUROMOD severely biases
    estimated tax revenue losses and poverty impacts, because younger, low-tenure workers with lower baseline wages and lower
    IRPF liabilities are displaced first.
  proposal: 'In plan/methods.md Pillar 1 (and M01 Section 5): (1) formalize a micro-econometric hazard assignment protocol
    calibrated on historical MCVL longitudinal panels (2008–2023) estimating worker-level job-separation and inactivity hazards
    conditional on tenure (antigüedad), contract type (codes 100/200/300), age, and firm size; (2) apply these estimated propensity
    ranks to assign involuntary displacement across CNO-11 cells in Step 1 before feeding post-displacement micro-records
    into EUROMOD-Spain, preventing LIFO tenure-bias distortions in baseline IRPF and Social Security tax projections.'
  sources:
  - title: Dual Labour Markets Revisited
    authors:
    - Bentolila, S.
    - Dolado, J. J.
    - Jimeno, J. F.
    year: 2020
    doi: 10.1093/acrefore/9780190625979.013.502
