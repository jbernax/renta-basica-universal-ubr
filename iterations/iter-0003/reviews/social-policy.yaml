- id: SP-03-03
  severity: major
  module: M02
  finding: 'To eliminate the benefit cliff for single-parent families (81% female-headed) under Tier A (€600 adult + €240
    child vs. €965.55 IMV baseline), M02 and M07 introduce an ad-hoc Complemento Monoparental y de Primera Infancia (+€150–€200/month).
    While fiscally protective on paper, this design creates a profound welfare architecture flaw: in Spanish administrative
    practice, conditioning cash on single-parent status (unidad de convivencia monoparental) requires intrusive verification
    that the claimant has no romantic cohabitant or undeclared adult partner (policía de la convivencia). Under IMV (Art.
    13.2 Ley 19/2021), verifying single parenthood is one of the leading causes of administrative rejections, multi-month
    processing delays, and loss of benefits when single mothers share an apartment with non-relatives or flatmates to cope
    with urban rent inflation (M05). Furthermore, Spain lacks a unified national statute on single parenthood, leaving definitions
    to conflicting regional decrees. Introducing a status-contingent single-parent bonus contradicts UBR''s core principle
    of unconditional individual entitlement (D-001), re-introducing means-testing, domestic surveillance, and cohabitation
    penalties through the back door.'
  proposal: 'Replace the status-contingent adult single-parent bonus in M02 with a structural Parity-Modulated Individual
    Child Benefit Schedule (Escala de Equivalencia por Paridad de Infancia): (1) Re-calibrate child benefit weights so that
    the first dependent minor in any family receives an individual UBR of 50% of the adult benefit (€300 under Tier A, €450
    under Tier B), while second and subsequent minors receive 35–40% (€210–€240 under Tier A). Because the highest fixed economies-of-scale
    costs of housing and childrearing are concentrated on the first dependent child, this parity modulation automatically
    ensures that single-parent families exceed previous IMV + CAPI baselines (€600 + €300 = €900 for 1 child under Tier A,
    or €1,110 for 2 children) purely through individual child entitlements, completely eliminating the need for any administrative
    investigation of adult cohabitation or marital status; (2) In M07, for any residual legacy cases during phased transition,
    establish an irrebuttable statutory presumption of single parenthood based solely on the Civil Registry (Libro de Familia)
    or judicial custody rulings, explicitly prohibiting administrative disqualification based on municipal Padrón cohabitation
    with non-lineal roommates.'
