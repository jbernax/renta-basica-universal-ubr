reviewer: social-policy
iteration: 3
summary: 'The iter-0003 research plan demonstrates substantial progress in welfare architecture through the introduction of
  the statutory Complemento Autonómico No Contributivo, the tiered Complemento Universal por Discapacidad, and the Empadronamiento
  Social de Oficio rail. However, five critical social-policy structural vulnerabilities undermine its lifecycle equity, administrative
  viability, and anti-poverty integrity: (1) M07 absorbs contributory unemployment benefits into flat UBR while protecting
  retirement pension contribution credits exclusively for workers aged 52+ under Art. 280 TRLGSS, terminating SEPE contribution
  credits for displaced workers under 52 and triggering severe pension hysteresis gaps (lagunas de cotización, Art. 209 TRLGSS)
  that depress retirement pensions by 20–40% over the life cycle; (2) M12''s inembargabilidad shield fails to neutralize the
  Social Security Administration''s internal statutory power under Art. 53.2 TRLGSS and Art. 73 LGT to execute administrative
  offsets (compensación de oficio) directly from ongoing benefits at source, exposing over 150,000 vulnerable families burdened
  with retrospective IMV overpayment debts (cobros indebidos) to automated 30% benefit deductions; (3) M02''s status-contingent
  Complemento Monoparental re-introduces intrusive domestic cohabitation inspections (policía de la convivencia) and administrative
  exclusion for single mothers sharing housing in tight rental markets, which must instead be resolved via a parity-modulated
  individual child allowance schedule; (4) M09''s microsimulations assess poverty strictly using standard equivalized disposable
  income without deducting non-discretionary disability expenses, artificially classifying severely disabled recipients as
  non-poor while omitting the 13 Eurostat Severe Material and Social Deprivation (SMSD) indicators of AROPE; and (5) M14 lacks
  formal modeling of the substitution elasticity between unconditional cash and professional care services under Ley 39/2006
  (SAAD), risking widespread care re-familialization and re-feminization if autonomous communities substitute scarce professional
  care infrastructure with cash.'
scores:
  spain_fit:
    score: 4.1
    rationale: 'Displays sophisticated institutional awareness of the foral economic agreements (Concierto/Convenio), the
      SAAD dependency framework (Ley 39/2006), and the padrón social technical instructions (BOE 2 May 2020). However, it
      retains two critical institutional blindspots: (1) it terminates SEPE-to-TGSS Social Security retirement contribution
      continuity for AI-displaced workers under age 52, overlooking the statutory calculation mechanics of Art. 209 TRLGSS
      and the recent unemployment assistance reform under RDL 2/2024; and (2) it overlooks internal administrative debt compensation
      under Art. 53 TRLGSS, leaving UBR accounts vulnerable to automatic INSS offsets for legacy IMV debts.'
  ethics_equity:
    score: 3.9
    rationale: 'Strongly grounded in individual entitlement (D-001) and the No-Loser Guarantee, with vital protections for
      disability living costs and regional rights. Nevertheless, major ethical and lifecycle equity concerns persist: (1)
      relying on an administrative single-parent status bonus recreates invasive domestic cohabitation surveillance of low-income
      mothers sharing flats; (2) ceasing pension contribution credits for mid-career displaced workers creates a severe inter-generational
      and gendered pension hysteresis trap; and (3) standard poverty metrics fail to deduct non-discretionary disability extra
      costs, masking persistent material deprivation.'
  coverage:
    score: 4.2
    rationale: Covers primary social policy reference factors F02, F08, F10, F13, F14, and F15 with high granularity. However,
      it still omits the institutional transformation and de-bureaucratization of municipal social services under regional
      Leyes de Servicios Sociales, overlooks the 13 Eurostat Severe Material and Social Deprivation (SMSD) items within AROPE,
      and neglects the risk of care re-familialization and service substitution under the SAAD dependency framework.
  internal_coherence:
    score: 4.0
    rationale: 'Benefit parameters (Tiers A/B/C) and AI shock paths (S1–S3) are quantitatively harmonized. Yet internal structural
      friction remains: M02 commits to unconditional individual transfers to eliminate cohabitation surveillance, yet introduces
      a household-contingent Complemento Monoparental that re-invites cohabitation policing; M12 guarantees inembargabilidad
      against commercial bank seizures, but fails to prevent TGSS administrative compensation under Art. 53 TRLGSS; and M07
      preserves pension credits for workers aged 52+ while stranding younger displaced cohorts.'
  evidence_grounding:
    score: 4.0
    rationale: Substantially strengthened by integrating official AIReF IMV evaluations, Puig & Segura (2021) disability cost
      estimates, and Ponthieux (2013) intra-household pooling metrics. However, it lacks empirical grounding in Spanish pension
      literature regarding the Beveridgean transition and contribution gap penalties (Conde-Ruiz & González 2016), omits the
      standard-of-living approach to disability poverty measurement (Zaidi & Burchardt 2005), and does not cite recent microsimulation
      evidence on Spanish family benefit architectures (Ayala et al. 2025).
issues:
- id: SP-03-01
  severity: critical
  module: M07
  finding: M07's Dual-Pillar integration absorbs contributory unemployment benefits (max(0, B_contrib - UBR)) and general
    SEPE subsidios, stipulating that workers aged 52+ preserve retirement pension contribution credits (cotización asimilada
    al alta por jubilación) under Art. 280 TRLGSS. However, it completely fails to protect the pension accrual of displaced
    workers under age 52. Under current Spanish Social Security law (Arts. 209, 273, and 280 TRLGSS, reformed by Real Decreto-ley
    2/2024), when a worker receives contributory unemployment benefits, SEPE directly pays Social Security contributions for
    common contingencies (retirement, disability, survival) to the TGSS on the worker's behalf. If UBR absorbs contributory
    unemployment benefits into a flat non-contributory cash transfer, SEPE ceases paying these Social Security retirement
    contributions. In Spain, retirement pensions are calculated by averaging the last 25 years (300 months) of contribution
    bases (Art. 209 TRLGSS). While general-regime employees receive partial gap-filling (integración de lagunas at 100% of
    the minimum base for 48 months and 50% thereafter), autonomous workers (RETA) and domestic workers receive zero gap-filling,
    and prolonged AI displacement under S2 (20% FTE displaced) or S3 (35% displaced) will permanently depress the regulatory
    base of younger and mid-career workers by 20–40% upon retirement. By terminating SEPE pension contributions for workers
    under 52 without a universal replacement credit, the plan creates a devastating life-cycle pension hysteresis trap, directly
    violating the No-Loser Guarantee over the recipient's life cycle.
  proposal: 'Restructure M07 Section 5 and M02 to establish a universal Crédito Cotizatorio Básico por Transición Tecnológica
    (or Cotización Ficticia de Inserción): (1) Mandate that every adult recipient receiving baseline UBR who is not formally
    employed or contributing through employment maintains an automatic asimilación al alta in the Social Security system with
    a continuous retirement contribution base equal to 100% of the minimum wage base (base mínima de cotización del Régimen
    General / SMI), funded directly from the automation tax buffer (M03/M16); (2) For displaced workers previously receiving
    contributory unemployment benefits, preserve their pre-displacement regulatory contribution base for up to 24 months,
    preventing any erosion of accumulated pension entitlements; (3) In M07 deliverables, include a life-cycle pension simulation
    assessing replacement rates across age cohorts (25–35, 36–51, 52–65) under S1–S3.'
  sources:
  - title: 'From Bismarck to Beveridge: the other pension reform in Spain'
    authors:
    - J. Ignacio Conde-Ruiz
    - Clara I. González
    year: 2016
    doi: 10.1007/s13209-016-0148-3
