- id: SP-03-05
  severity: major
  module: M14
  finding: In Spain, care work is heavily feminized, with women providing over 80% of informal eldercare and childcare. Under
    the Ley de Promoción de la Autonomía Personal y Atención a las personas en situación de dependencia (Ley 39/2006, SAAD),
    the cash allowance for non-professional home care (Prestación Económica para Cuidados en el Entorno Familiar, PECEF under
    Art. 18) historically became the default benefit, causing widespread re-familialization and re-feminization of care that
    trapped female caregivers in unpaid domestic labor and prompted withdrawal from the formal labor market. While M14 Section
    7 acknowledges that UBR might risk female labor-market detachment and suggests pairing it with 0–3 childcare and SAAD
    preservation, M14 completely lacks formal research questions, empirical estimands, or structural models capturing the
    substitution elasticity between unconditional individual cash transfers and SAAD professional care services (such as Servicio
    de Ayuda a Domicilio [SAD], day centers, and residential places). If an unconditional cash transfer of €900/month is disbursed
    without a legally binding expansion of professional care services, cash will economically substitute for scarce public
    care infrastructure. Regional governments (Comunidades Autónomas), which co-finance 50%+ of SAAD expenditures under Art.
    32 Ley 39/2006, will face strong budgetary incentives to cut or freeze expensive professional care contracts, transferring
    the physical and emotional burden of intensive dependency care back into private households, rolling back decades of feminist
    de-familialization.
  proposal: 'Expand M14 with a dedicated Care Economy Structural Modeling & Service Non-Substitution Architecture: (1) Add
    a new research question (or empirical submodule in Section 5) specifying a multi-sectoral time-use and care-choice model
    (estimating cross-price and income elasticities of demand between informal home care, formal private care, and SAAD subsidized
    professional care across income deciles using INE EET and SAAD administrative records); (2) Codify a statutory Cláusula
    de Garantía de No-Sustitución de Servicios Profesionales de Cuidados in M14 and M07, prohibiting Autonomous Communities
    from substituting SAAD direct in-kind services (SAD, telecare, day care) with cash or reducing public care contracts following
    UBR rollout; (3) Incorporate an explicit pilot metric in M10 tracking caregiver burden, respite hours, and formal care
    utilization to empirically test for re-familialization dynamics.'
  sources:
