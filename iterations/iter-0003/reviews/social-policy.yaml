    year: 2015
    url: https://www.boe.es/buscar/act.php?id=BOE-A-2015-11724
- id: SP-03-02
  severity: critical
  module: M12
  finding: M12 Section 5 formulates an inembargabilidad shield anchored in Art. 607 LEC and Art. 44 TRLGSS, plus LPAC Art.
    41 automated due-process safeguards, to guarantee unhindered access to the mínimo existencial. However, this legal architecture
    overlooks the Social Security Administration's internal statutory power under Art. 53.2 TRLGSS and Ley 58/2003 (LGT Art.
    73) to execute administrative offsets (compensación interna de oficio) of up to 30% directly from ongoing Social Security
    disbursements at source, completely bypassing civil judicial attachment under the LEC. Over 150,000 vulnerable Spanish
    households are currently burdened with thousands of euros in retroactive debt recovery claims (cobros indebidos) issued
    by the INSS due to 12-to-24-month administrative lags in reconciling annual IRPF data (AIReF 2023, 2024). If UBR absorbs
    IMV and is disbursed via INSS or AEAT rails, automated TGSS offset algorithms will mechanically deduct 30% from the monthly
    subsistence transfers of the poorest families to amortize prior IMV overpayment debts, plunging them back into destitution
    (€420 under Tier A or €630 under Tier B) and subverting the universality and unconditional living floor of UBR (D-001).
  proposal: 'Upgrade M12 Section 5 and M07 with an ironclad Statutory Debt Cancellation and Administrative Immunity Protocol:
    (1) Draft a model Disposición Transitoria enacting a comprehensive Amnistía Social y Cancelación de Oficio de Cobros Indebidos
    del IMV that legally extinguishes all non-fraudulent retroactive IMV debt claims generated by administrative tax-reconciliation
    delays prior to UBR implementation; (2) Explicitly amend the inembargabilidad statutory charter in M12 to declare that
    baseline UBR clearing accounts are strictly immune from administrative compensation, set-off, or deduction (incompensabilidad
    absoluta) under Art. 53 TRLGSS and Arts. 71–73 LGT, barring any public entity (TGSS, AEAT, regional treasuries) from executing
    automatic source deductions against the subsistence cash transfer; (3) Mandate that any contested administrative recovery
    action must follow a separate judicial pathway without impairing ongoing monthly liquidity.'
