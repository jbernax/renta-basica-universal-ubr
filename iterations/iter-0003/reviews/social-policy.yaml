- id: SP-03-04
  severity: major
  module: M09
  finding: 'While M14 and M07 established the Complemento Universal por Discapacidad (+25% to +100%) to offset non-discretionary
    impairment expenses (€3,500–€10,000/yr per Puig-Segura 2021), M09''s distributional microsimulation methodology continues
    to measure poverty and inequality strictly through standard unadjusted equivalized disposable income against headline
    AROPE thresholds. This generates a major methodological blindspot: because standard AROPE thresholds treat disability
    supplements as unencumbered discretionary income without deducting non-discretionary disability-specific expenditures
    (specialized transportation, medical prosthetics, personal care aids, thermal comfort), households with disabled members
    are mechanically classified as non-poor and categorized in middle-income deciles, even when their effective disposable
    standard of living falls far below subsistence (Zaidi & Burchardt 2005). Furthermore, M09 focuses almost exclusively on
    monetary poverty (P0, P1, P2, Gini), ignoring the non-monetary Severe Material and Social Deprivation (SMSD / carencia
    material y social severa) pillar of the AROPE indicator (13 Eurostat items including utility arrears, inability to face
    unexpected expenses, and inadequate heating), which is critical for evaluating whether cash transfers actually eradicate
    living deprivation.'
  proposal: 'Expand M09 Section 5 and deliverables with an integrated Multi-Dimensional Poverty and Disability-Equivalized
    Microsimulation Protocol: (1) Formulate an Impairment-Adjusted Equivalized Disposable Income Metric (y_i^adj = (y_i^disp
    - C_i^disab)/phi(k_i)) in EUROMOD-Spain, applying the standard-of-living estimation approach (Zaidi & Burchardt 2005)
    calibrated with ECV health/disability modules and Puig-Segura et al. (2021) parameters to accurately reflect effective
    poverty rates among disabled populations; (2) Model the 13 Eurostat SMSD deprivation items using a micro-econometric probit/logit
    module linked to household net cash liquidity and utility/housing cost burdens, demonstrating how universal cash plus
    disability supplements reduces material deprivation across Autonomous Communities.'
  sources:
  - title: 'Comparing Incomes When Needs Differ: Equivalization for the Extra Costs of Disability in the UK'
    authors:
    - Asghar Zaidi
    - Tania Burchardt
    year: 2005
    doi: 10.1111/j.1475-4991.2005.00146.x
