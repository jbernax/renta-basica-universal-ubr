- id: RT-03-06
  severity: minor
  module: M01
  finding: In M01 (RQ-M01-01, Section 1, Section 3), the research plan assumes that Spanish labor institutions (collective
    bargaining wage floors and dismissal protections under Real Decreto-ley 32/2021) prevent downward nominal wage flexibility,
    forcing all AI cognitive displacement to adjust exclusively through intermittent open-ended contract inactivity (pases
    a inactividad de fijos discontinuos) and non-renewal of temporary hours. This assumption is institutionally flawed and
    economically myopic. Under Article 82.3 of the Estatuto de los Trabajadores (reformed by RDL 32/2021), employers facing
    economic, technical, organizational, or production (ETOP) causes can execute statutory collective bargaining opt-outs
    (descuelgues salariales) to modify wage tables, working hours, and remuneration systems below sector-level collective
    agreements. In severe cognitive displacement scenarios (S2 and S3, where 20% to 35% of tasks are automated), competitive
    pressure will force Spanish service-sector and professional enterprises to execute widespread Art. 82.3 ET descuelgues
    or collective dismissal proceedings (EREs under Art. 51 ET), triggering substantial nominal wage suppression rather than
    mere seasonal inactivity. By ignoring descuelgues salariales and EREs, M01 mis-specifies the counterfactual pre-UBR earnings
    distribution fed into EUROMOD-Spain (M03, M09), underestimating wage cuts among retained workers while overestimating
    the share of workers on intermittent social security subsidies.
  proposal: 'In M01 and methods.md: (1) Extend the Spanish institutional adjustment channels to include statutory descuelgues
    salariales under Art. 82.3 ET and collective restructuring under Art. 51 ET, tracking historical ETOP opt-out filings
    and wage modifications in Ministry of Labor Estadística de Convenios Colectivos de Trabajo; (2) Model a dual adjustment
    margin in the Acemoglu-Restrepo calibration: intensive-margin nominal wage degradation via descuelgues for retained workers
    alongside extensive-margin FTE displacement via fijos discontinuos and EREs; (3) Provide sector-specific elasticity bounds
    for cognitive services where enterprise-level opt-outs bypass provincial collective agreements, generating an accurate
    counterfactual wage distribution for EUROMOD-Spain.'
