- id: RT-03-02
  severity: critical
  module: M10
  finding: M10 (RQ-M10-01, Section 5.1) and methods.md (Section 4) suffer from an econometric identification failure due to
    residual spatial commuting contamination across cluster buffer boundaries (JD-02-02). The experimental design establishes
    J = 70 spatial clusters (35 treated, 35 control, m ≈ 285 adults, N ≈ 20,000) defined as small municipalities (1,500–5,000
    residents) or transit-bounded urban districts, surrounded by 2–5 km geographic buffer zones and donut matching to satisfy
    the Stable Unit Treatment Value Assumption (SUTVA). However, in Spain's integrated metropolitan and peri-urban labor and
    retail markets (e.g. the suburban rings of Madrid, Barcelona, Valencia, Seville, or Basque industrial valleys), daily
    labor commuting, commercial shopping, and service consumption routinely span 15–30 km. In a 2–5 km radius, workers residing
    in control clusters commute daily to jobs in treated clusters (or vice versa), and treated recipients spend their UBR
    liquidity in commercial establishments, supermarkets, and healthcare facilities located in adjacent control clusters.
    This cross-border economic activity introduces unmeasured general-equilibrium price spillovers, wage-bargaining interference,
    and retail demand shocks into control units, violating SUTVA. Relying solely on static euclidean distance buffers without
    controlling for inter-cluster mobility biases both rental pass-through estimates (M05) and labor-supply reservation wage
    effects (M08).
  proposal: 'In M10 and methods.md, upgrade the spatial econometric identification strategy: (1) Integrate a daily commuting-flow
    spatial weight matrix (W_mobility) into the cluster econometric specification, estimated using the Ministry of Transport
    (MITMA) and INE''s mobile-phone tracking microdata (Estudio de la Movilidad con Telefonía Móvil); (2) Implement a continuous
    spatial spillover exposure estimator following Egger et al. (2022) and Baird et al. (2018), parameterizing treatment intensity
    as a function of commuting-weighted cash inflows (Z_c = sum_j W_{cj} * Cash_j) to net out spatial interference; (3) Redefine
    cluster boundaries in metropolitan provinces strictly along self-contained Functional Urban Areas (FUAs / Áreas Urbanas
    Funcionales INE) with internal commuting self-containment ratios exceeding 80%, rather than porous 2–5 km geographic radii.'
