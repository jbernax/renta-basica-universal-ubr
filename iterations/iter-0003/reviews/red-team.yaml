- id: RT-03-05
  severity: major
  module: M06
  finding: M06 (RQ-M06-01, Section 5.1) and M13 (Section 5) develop an in-depth legal analysis of the Basque and Navarrese
    foral regimes (classifying UBR as a carga no asumida under the Concierto and Convenio), but completely ignore the statutory
    mechanics of Spain's Common Regime territorial financing system (Ley 22/2009 and LOFCA Art. 13). In the 15 Common Regime
    Autonomous Communities, 50% of IRPF collections belong by statute to regional treasuries (tarifa autonómica), and 75%
    of regional tax capacity is compulsory pooled into the Fondo de Garantía de Servicios Públicos Fundamentales (FGSPF) to
    equalize per-capita funding for regional health, education, and social services across Spain. Under M03, the State restructures
    IRPF by repealing the mínimo personal y familiar (Arts. 56–61 LIRPF), folding the earned income allowance (Art. 20 LIRPF),
    and raising top marginal rates up to 52%. If the State unilaterally absorbs these IRPF revenues to fund a centralized
    national UBR, it mechanically disrupts the 50% regional ceded tax share, alters regional fiscal capacities (capacidad
    tributaria normativa), and induces massive, uncompensated fiscal imbalances in the FGSPF and the Fondo de Suficiencia
    Global. M06 fails to provide any statutory amendment mechanism to Ley 22/2009 to ensure territorial fiscal neutrality
    between net contributing regions (Madrid, Catalonia, Balearics) and recipient regions (Extremadura, Andalusia).
  proposal: 'In M06 and M13: (1) Specify the statutory amendment clauses for Ley 22/2009 de Financiación de las CCAA and LOFCA
    Art. 13, defining how the 50% ceded IRPF tariff interacts with the national UBR refundable tax credit; (2) Formulate a
    statutory clearing mechanism inside the Fondo de Garantía de Servicios Públicos Fundamentales (FGSPF) and Fondo de Suficiencia
    Global ensuring that Common Regime regional budgets are held strictly harmless (zero net reduction in regional funding
    for health and education); (3) Model the multilateral negotiation roadmap through the Consejo de Política Fiscal y Financiera
    (CPFF) required to ratify this inter-territorial fiscal restructuring.'
