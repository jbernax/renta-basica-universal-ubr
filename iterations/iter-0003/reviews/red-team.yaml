- id: RT-03-03
  severity: major
  module: GLOBAL
  finding: 'A fundamental arithmetic and fiscal accounting disconnect persists between M01''s macroeconomic scenario projections
    and M03''s fiscal bridge. In M01 (RQ-M01-02), a -7.0 pp labor share contraction under Scenario S2 erodes baseline combined
    IRPF and Social Security payroll receipts by 11.55% of GDP (~€173B/year in 2026 euros). Gross UBR outlays for Tier B (€900/adult,
    €360/minor) total ~€466.5B (~30% of GDP). Non-contributory welfare savings in M07 yield ~€14.5B (~0.95% of GDP), while
    contributory pensions (>€900/mo) retain ~5.5–6.0% of GDP (~€90B) and require a €7.5B tax-neutrality supplement. In M16
    (RQ-M16-02), the research plan explicitly admits that after deducting lost employer payroll contributions, net corporate
    surplus taxes yield only 0.9–1.2% of GDP (~€13.5–€18B). Yet M03 (RQ-M03-01) inexplicably claims that under S2, the "consolidated
    net financing requirement" is only 4.8–6.2% of GDP, and that net disposable breakeven remains at the 82nd–86th gross income
    percentile (€38,000–€44,000/year) under a 38–52% marginal rate schedule. This arithmetic is impossible: if baseline tax
    revenues drop by 11.55% of GDP, merely maintaining pre-reform public services (€125B/yr) already requires 11.55% of GDP
    in replacement revenue. Adding the net redistribution cost of Tier B (~5% of GDP) minus M07 savings (~1% of GDP) creates
    a true net fiscal gap of ~15.5% of GDP (~€230B/year). Under S2, the aggregate wage bill shrinks to ~40% of GDP (~€600B);
    total gross earnings in deciles 9 and 10 (above the 84th percentile) amount to less than €180B. Even taxing 100% of all
    earnings above the 84th percentile could not raise €230B. M03 is concealing a structural deficit of ~10% of GDP (~€150B/year)
    behind wishful static accounting that assumes pre-AI tax yields.'
  proposal: 'Close the macro-micro fiscal accounting loop across 00-scope, M01, M03, and M16: (1) Provide an explicit, fully
    balanced consolidated Administraciones Públicas accounting bridge table for Scenario S2 that itemizes: (i) Baseline Tax
    Erosion (-11.55% of GDP), (ii) Gross UBR Outlays (-30.0% of GDP), (iii) Non-Contributory Welfare Savings (+0.95% of GDP),
    (iv) Net Corporate Surplus Taxes (+1.1% of GDP), (v) Net IRPF Collections, and (vi) Additional Consumption, Wealth, and
    Environmental Tax Yields; (2) Formally acknowledge that under S2, either the IRPF breakeven threshold must shift down
    to median earnings (decile 5, ~€24,000/year) with higher marginal rates across deciles 5–8, or the plan must specify explicit,
    massive new non-labor revenue bases (e.g. broad-base VAT rate increases and high-net-worth wealth levies), or Tier B benefits
    must be dynamically scaled down via macro-indexation until capital taxes mature.'
