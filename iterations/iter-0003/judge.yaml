scores:
  coverage:
    score: 5.0
    rationale: Exhaustive coverage of all 17 reference factors (F01–F17) mapped one-to-one to dedicated research modules (M01–M17)
      with complete 8-section modular architecture. Quantified macroeconomic, microeconomic, and institutional feedback loops
      are completely formalized across modules—including the macro-to-micro AI displacement tax erosion loop (M01 to M03/M09),
      open-economy Eurozone HANK closure with dual external leakage (M04), closed-loop landlord rental recycling into progressive
      IRPF brackets disaggregated by physical vs. corporate/non-resident owners (M05 to M09 to M03), factor-neutral corporate
      surplus capture with double-counting payroll deduction (M16), and state-contingent transition circuit-breakers (M17).
    evidence:
    - 1-to-1 mapping of reference factors F01–F17 to modules M01–M17 with complete 8-section modular architecture
    - Explicit 4-stage micro-macro Gauss-Seidel closure pipeline linking M01, M03, M04, M05, M07, M08, and M09 in methods.md
      converging within +-0.05% GDP
    - Dynamic ingestion of M01 counterfactual post-displacement earnings distributions into EUROMOD-Spain under S2 2.73% GDP
      baseline revenue shock
    - Closed-loop private landlord rental income recycling into progressive IRPF tax brackets in M09 and M03 disaggregated
      by physical persons, SOCIMIs, and non-residents
    - Double-counting correction in M16 deducting lost payroll contributions from corporate surplus tax yields feeding the
      consolidated public accounts bridge
  rq_quality:
    score: 5.0
    rationale: Research questions across all 17 modules are field-defining, policy-relevant, and accompanied by quantitative,
      falsifiable hypotheses tailored to Spanish legal and economic institutions. The RQs systematically distinguish competing
      theoretical mechanisms (such as Frisch intertemporal substitution vs. permanent compensated wage elasticity vs. involuntary
      labor rationing in M15; standalone rent caps vs. federal tax deduction conditionality in M05; and unconstitutional decree-law
      surcharges vs. pre-enacted statutory automatic stabilizers in M17) and specify exact empirical decision thresholds for
      policy design.
    evidence:
    - RQ-M01-01 and RQ-M01-02 define exact net FTE displacement (8%, 20%, 35%) and baseline tax revenue erosion (0.98%, 2.73%,
      5.85% GDP) across S1-S3
    - RQ-M03-01 specifies net breakeven gross income percentiles (82nd-86th percentile, 38,000-44,000 EUR/yr) under consolidated
      status-quo budget neutrality
    - RQ-M05-01 and RQ-M05-02 distinguish 5-year LAU contracts from new listings (25-38% pass-through) and condition LIRPF
      Art. 23.2 deductions on SERPAVI rent indices
    - RQ-M07-01 and RQ-M07-02 establish the Dual-Pillar pension integration (<0.5% GDP neutrality cost) and Art. 273/280 TRLGSS
      contribution credit continuity
    - RQ-M10-01, RQ-M10-02, and RQ-M10-03 define exact cluster sample sizes (J=70, N=20,000), power targets, convex disregard
      bunching kinks (3,000-5,000 EUR/yr), missing-mass phase-outs, and Art. 95.1.k LGT register linkage
    - RQ-M11-01 and RQ-M11-02 test the CARIN deservingness heuristic via a 3,500-voter conjoint experiment and specify congressional
      override of Senate LOEPSF Art. 15.6 veto
    - RQ-M12-01, RQ-M12-02, and RQ-M12-03 establish the Unified Monthly Tax-Transfer Clearing Account, Numerical Tax Code
      GDPR shield, and Art. 607/608 LEC inembargabilidad
    - RQ-M16-01, RQ-M16-02, and RQ-M16-03 specify IECA B2B compute reverse charges, IRAP Net Operating Surplus yields under
      Banca Popolare di Cremona, and counter-cyclical fund accumulation
    - RQ-M17-01 and RQ-M17-02 define quantitative AIReF composite index bands (<1.0, 1.0-2.5, >=2.5) triggering statutory
      rate schedules or expedited congressional urgency (STC 73/2017 compliant)
  methodological_rigor:
    score: 5.0
    rationale: Methodological designs represent frontier standards in public finance, labor economics, and causal inference.
      The plan specifies exact administrative microdata variables (EPA 3-digit CNO-11, MCVL contract codes 100/200/300, AEAT
      Form 111/190 withholdings, ETICCE firm-size adoption, BDCAP CIP records, and INCASÒL/IVIMA/AVRA rental deposits). It
      details complete econometric identification strategies including Borusyak-Hull-Jaravel shift-share IV balance tests,
      Saez/Chetty bunching estimators around convex disregard kinks (3,000-5,000 EUR/yr) and Kleven missing-mass estimators
      at concave phase-out ceilings, MaCurdy/Blundell-MaCurdy life-cycle structural parameter transportability equations with
      Bargain et al. labor rationing, Cherchye discrete-choice collective household models, and a closed Gauss-Seidel micro-macro
      loop between EUROMOD and open-economy HANK.
    evidence:
    - Shift-share IV with Borusyak-Hull-Jaravel shock-level balance tests in M01
    - Two-stage randomized saturation cluster formula (J=70) with Functional Urban Area commuting buffers (>=80% self-containment),
      mobile-phone commuting weights (W_mobility), and SDID estimators in M10
    - Convex disregard bunching (Saez/Chetty) and missing-mass ceiling estimators (Kleven) identifying compensated wage and
      income elasticities in M08 and M10
    - MaCurdy structural life-cycle decomposition equation separating Frisch substitution, permanent elasticity, windfall
      income effects, and involuntary labor rationing in M15
    - Cherchye discrete-choice collective household model with female non-participation corner solutions on EET/ECV microdata
      in M14
    - Four-stage Gauss-Seidel micro-macro iterative closure between EUROMOD-Spain and open-economy currency-union HANK converging
      within +-0.05% GDP in methods.md, M03, and M04
  evidence_grounding:
    score: 5.0
    rationale: The plan is grounded in a comprehensive, critical synthesis of 127 machine-verified frontier sources in plan/sources.yaml.
      It systematically reconciles conflicting empirical estimates across international trials and calibrations—reconciling
      Acemoglu TFP modesty with severe displacement literature by bracketing S1 against S2/S3 (M01); reconciling OpenResearch
      temporary leisure responses with permanent policy through life-cycle Frisch decomposition and Bargain et al. labor rationing
      (M15); reconciling OpenResearch lack of clinical physical biomarker/cost improvements with mental health gains, treating
      physical healthcare savings as exploratory (M14); and reconciling French housing allowance inflation and Catalan rent
      control evasion with dual-tenure LAU 5-year lock-in and federal tax conditionality (M05).
    evidence:
    - 127 machine-verified academic, legal, and institutional citations in sources.yaml with 0 validation errors
    - Synthesis and reconciliation of Acemoglu TFP modesty with Korinek-Suh and Cazzaniga displacement paths in M01
    - Structural reconciliation of OpenResearch, Finland, and Alaska PFD empirical estimates using MaCurdy life-cycle equations
      in M15
    - Empirical alignment with AIReF IMV evaluations (56% IMV non-take-up, 70% CAPI non-take-up) in M02, M09, and M12
    - Reconciliation of CJEU Case C-475/03 (Banca Popolare di Cremona) on Net Operating Surplus with EU VAT Directive Art.
      401 in M16
    - Integration of Spanish Constitutional Court jurisprudence (STC 158/2021, STC 19/2024, STC 182/2021, STC 79/2024, STC
      214/1994, STC 73/2017) across M05, M06, M12, M13, M16, and M17
  spain_fit:
    score: 5.0
    rationale: The plan provides an actionable blueprint ready for evaluation by AIReF, the Instituto de Estudios Fiscales
      (IEF), and ministerial technical secretariats. It specifies exact statutory reforms across the Spanish legal order (Constitución
      Española, Ley 35/2006 del IRPF, Ley 27/2014 del Impuesto sobre Sociedades, RDLeg 5/2004 del TRIRNR, Ley 58/2003 LGT,
      TRLGSS, Ley 12/2023 de Vivienda, LAU, LOEPSF, LOFCA, Ley 22/2009, Basque Concierto Económico, Navarrese Convenio Económico,
      Ley 1/2000 LEC, LPAC, and LRJSP). It details the inter-administrative data-linking protocol linking AEAT, INSS, TGSS,
      regional health services, and Padrón Continuo using HMAC-SHA256 salted hashes, and resolves territorial financing mechanics
      with strict bifurcation between Common Regime CCAA (Fondo de Compensación UBR) and Foral territories (carga no asumida).
    evidence:
    - Detailed statutory amendment blueprints for LIRPF, LIS, TRIRNR, LGT, TRLGSS, and LOFCA across M03, M06, M07, M12, M16,
      and M17
    - Statutory habilitation under Art. 95.1.k LGT and LOPDGDD for inter-administrative microdata linkage across AEAT, TGSS,
      and SEPE in M10
    - Bifurcated territorial financing treating national UBR as a carga no asumida in Basque Concierto (6.24%) and Navarrese
      Convenio (1.6%), and amending Ley 22/2009 via CPFF Fondo de Compensación UBR for Common Regime CCAA in M03, M06, and
      M07
    - Bifurcated health evaluation architecture combining centralized INSS IT registers with regional convenios under Ley
      16/2003 in M10 and M14
    - Objective Federal Fiscal Benchmark under Art. 149.1.14 CE conditioning LIRPF Art. 23.2 deductions on SERPAVI indices
      to bypass regional ZMRT boycotts under STC 79/2024 in M05 and M17
  ai_scenarios:
    score: 5.0
    rationale: The three conditional AI displacement scenarios (S1, S2, S3) are fully operationalized and integrated across
      all 17 research modules. Each scenario defines explicit parameter paths for labor-share contraction (-2.5 pp, -7.0 pp,
      -15.0 pp), displaced FTE shares (8%, 20%, 35%), baseline tax revenue erosion (0.98%, 2.73%, 5.85% GDP), target UBR benefit
      tiers (Tier A 600 EUR, Tier B 900 EUR, Tier C 1,200 EUR), and financing shifts from labor income tax to destination-based
      AI compute withholding (IECA) and Net Operating Surplus.
    evidence:
    - Harmonized scenario definitions in plan.yaml, 00-scope.md, and methods.md carried through M01-M17
    - Dynamic ingestion of M01 counterfactual post-displacement earnings distributions into EUROMOD-Spain under S2 2.73% GDP
      baseline revenue shock
    - Consolidated AP fiscal bridge in M03 balancing S2 2.73% GDP baseline tax erosion through capital and automation bases
    - Macroeconomic stress-testing in M04 evaluating sovereign spreads and terms-of-trade under S1-S3
    - Counter-cyclical windfall accumulation rule (>1.20 x baseline EBE) in M16 adapting Sovereign AI Dividend Fund capitalization
      to realized corporate surplus across S1-S3
    - AIReF composite displacement index (I_AI,t) with quantitative trigger bands (<1.0, 1.0-2.5, >=2.5) governing phased
      transition from Tier A to Tier B to Tier C in M17
  feasibility:
