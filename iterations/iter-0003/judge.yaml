  counterarguments:
    score: 5.0
    rationale: Every module explicitly engages with steel-manned counterarguments and pre-commits to quantitative disconfirmation
      criteria and design mitigations. Major objections—including Acemoglu productivity modesty (M01), single-adult housing
      adequacy (M02), middle-decile effective tax hikes (M03), balance-of-payments import leakage (M04), urban rent capitalization
      (M05), EU free movement challenges (M06), Bismarckian contributory alienation (M07), compounding tax-substitution effects
      (M08), floating poverty threshold mirages (M09), finite-horizon trial bias (M10, M15), territorial fiscal backlash and
      employer capital flight (M11, M16), registration fraud (M12), cross-border welfare magnetism (M13), secondary-earner
      labor detachment and disability benefit substitution (M14), low-income windfall sample bias (M15), and democratic deficit
      / tax legality infringements (M17)—are systematically analyzed with explicit falsifiable tests and statutory/policy
      fallback mechanisms.
    evidence:
    - Pre-committed housing disconfirmation threshold (>3.0 pp excess rental inflation) triggering immediate LIRPF Art. 23.2
      deduction revocation, seasonal rent caps, and municipal preemption in M05 and M17
    - Excision of unconstitutional decree-law tax surcharges in M17, strictly conforming to STC 73/2017 and STC 78/2020 via
      pre-enacted statutory automatic stabilizers or expedited congressional urgency
    - Objective Federal Fiscal Benchmark under Art. 149.1.14 CE in M05 and M17 bypassing regional ZMRT boycotts under STC
      79/2024
    - Structural life-cycle decomposition equation in M15 isolating Frisch substitution and temporary discount factors to
      prevent finite-horizon bias
    - Statutory non-substitution wall for SAAD professional care services under Ley 39/2006 in M14 preventing informal re-familialization
    - Dual-Pillar contributory pension formula in M07 preserving positive contributory slopes and Art. 273/280 TRLGSS pension
      credits to maintain union legitimacy
  ethics_equity:
    score: 5.0
    rationale: The research plan achieves an exemplary standard of ethical and distributional design. It enforces an inviolable
      No-Loser Guarantee protecting every vulnerable group (pensioners, disabled individuals, single parents, and regional
      minimum income recipients) during transition through the Complemento de Neutralidad Fiscal (<0.5% GDP) and Complemento
      de Garantía de Derechos Adquiridos. It guarantees disability equity through a tiered Complemento Universal por Discapacidad
      (+25%, +50%, +100% per RD 888/2022) and Zaidi-Burchardt impairment-adjusted poverty measurement. It secures gender and
      care equity through individual cash entitlements, Cherchye collective household modeling, and SAAD professional care
      non-substitution. In pilot ethics, it sets a gold standard with statutory safe-harbors against pre-existing benefit
      loss, 6-month post-pilot step-down ramps, HMAC-SHA256 pseudonymization, GDPR Art. 9 compliance, Numerical Tax Codes
      shielding employee data, absolute inembargabilidad shields (Art. 607 LEC / Art. 44 TRLGSS) with Art. 608 LEC child support
      carveouts, immunity from bank overdrafts and public debt set-offs (Art. 53.2 TRLGSS, Arts. 71-73 LGT), LPAC Art. 82
      hearing rights, and unconditional 250-300 EUR/yr control participant stipends.
    evidence:
    - Inviolable No-Loser Guarantee ensuring zero disposable income loss for vulnerable cohorts via the Complemento de Neutralidad
      Fiscal (<0.5% GDP) in M07
    - Three-tiered statutory Complemento Universal por Discapacidad (+25%, +50%, +100% per RD 888/2022) fully covering extra
      living costs (3,500-10,000 EUR/yr) in M02, M07, and M14
    - Parity-modulated child schedule (alpha_1 = 0.50, alpha_ge2 = 0.40) and unconditional child safe-harbor under Art. 39
      CE in M02, M07, and M13
    - SAAD professional care non-substitution guarantee under Ley 39/2006 preventing informalization of care onto women in
      M14
    - Tax-Benefit Symmetry protocol with default non-refundable minimo personal y familiar (5,550 EUR) preventing euro-1 taxation
      during waiting periods (STC 214/1994) in M13
    - Statutory inembargabilidad shield under Art. 607 LEC and Art. 44 TRLGSS with Art. 608 LEC child support carveout in
      M12
    - Statutory bar on commercial bank overdraft set-offs and public debt compensation (Art. 53.2 TRLGSS, Arts. 71-73 LGT)
      for retroactive IMV overpayments in M12
    - Unconditional Evaluation Participation Stipend (250-300 EUR/yr) for control participants and 6-month post-pilot step-down
      ramp in M10
critical_issues: []
top_improvements:
- Empirical estimation of the CNO-11 AI exposure crosswalk on actual EPA 2024–2026 microdata files to populate the S1–S3 post-displacement
  wage vectors.
- Execution of the EUROMOD-Spain policy simulation scripts (.xml / Stata) incorporating the 2026 IRPF tariff brackets and
  the Dual-Pillar pension integration algorithm.
- Calibration and simulation of the small-open-economy currency-union HANK model in Dynare/Julia to generate quantitative
  impulse response functions for core inflation and sovereign spreads.
- Field deployment and geographic boundary mapping for the J=70 saturation pilot clusters using INE Functional Urban Area
  (FUA) commuting matrices (W_mobility).
- Drafting the full statutory text of the Anteproyecto de Ley for the individual refundable UBR tax credit, LOFCA Art. 13
  CPFF Fondo de Compensación UBR, and Foral Treaty Cupo/Aportación bilateral schedules.
- Pre-registration of the AEA RCT Registry experimental protocol with full power curves and Mock Analysis scripts for SDID
  on regional tenancy deposit registries (INCASÒL, IVIMA, AVRA).
- Implementation of the high-frequency rental nowcasting pipeline linking scraped web portal APIs with monthly deposit registry
  inflows to test the 30-day latency circuit-breaker.
- Execution and fielding of the pre-registered conjoint survey experiment (N = 3,500) across Spanish voter cohorts to empirically
  calibrate the CARIN deservingness parameter weights.
- Formal technical consultation with AEAT, INSS, and Banco de España to audit the Numerical Tax Code (Código de Retención
  Sintético) and SEPA payment clearing throughput.
- Actuarial simulation of the Sovereign AI Dividend Fund accumulation under Regulation (EU) 2024/1263 Net Primary Expenditure
  ceilings across S1–S3 factor-share trajectories.
sota_assessment: The Universal Basic Rent (Spain) research plan represents a state-of-the-art, publication-grade academic
  and policy blueprint that meets or exceeds the highest standards of top-tier economics journals (e.g., Quarterly Journal
  of Economics, American Economic Review, Journal of Public Economics) and official independent fiscal authorities (AIReF,
  IEF, European Commission). Across all 17 research modules and cross-cutting methodological documents, the plan seamlessly
  integrates frontier task-based AI displacement modeling (CNO-11/ISCO crosswalks, sequential shock protocols), micro-macro
  general equilibrium closure (a closed Gauss-Seidel loop between EUROMOD-Spain and an open-economy currency-union HANK model),
  deep Spanish constitutional and territorial institutional precision (strictly bifurcating Common Regime LOFCA/Ley 22/2009
  mechanisms from Basque and Navarrese Foral Treaties as cargas no asumidas, and establishing an Objective Federal Fiscal
  Benchmark under Art. 149.1.14 CE to bypass regional housing boycotts under STC 79/2024), rigorous causal evaluation design
  (a two-stage randomized saturation cluster trial across J=70 clusters with mobile-phone commuting spillover closure, Saez/Chetty
  bunching at convex disregard kinks, and Kleven missing-mass phase-outs), and gold-standard ethical protections (an inviolable
  No-Loser Guarantee, universal disability supplements, SAAD care non-substitution, and statutory inembargabilidad shields
  with child-support carveouts under Art. 608 LEC). With all 10 rubric criteria achieving top-anchor ratings (5.0/5.0), zero
  open critical issues, and 127 machine-verified citations, the research plan is fully mature and ready for empirical execution
  and monograph drafting.
