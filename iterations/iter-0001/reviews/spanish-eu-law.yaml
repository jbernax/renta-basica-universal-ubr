reviewer: spanish-eu-law
iteration: 1
summary: >-
  Modules M06, M07, M12, and M13 establish a credible initial constitutional and administrative spine
  anchored in the 1978 Spanish Constitution, LOFCA, Ley 35/2006 (IRPF), Ley 19/2021 (IMV), and EU
  Regulation 883/2004, but exhibit four critical legal-doctrinal and operational vulnerabilities:
  (1) M06 conflates mutually exclusive EU legal categories (Regulation 883/2004 Annex X special
  non-contributory cash benefits vs. direct-tax refundable credits under Art. 45 TFEU and Directive
  2004/38/EC), cites inaccurate Tribunal Constitucional case numbers in prose without formal sources.yaml
  locators instead of the actual IMV competence rulings (STC 158/2021 and STC 19/2024), omits the 50%
  regional IRPF tranche mechanics under Ley 22/2009 and the Basque Concierto Económico (Ley 12/2002),
  and omits AI-scenario differentiation (S1-S3); (2) M07 proposes absorbing SEPE unemployment subsidios
  without preserving the Art. 280 TRLGSS retirement pension contribution credit for workers aged 52+,
  overlooks the exclusive Autonomous Community competence over Rentas Mínimas Autonómicas (Art. 148.1.20 CE),
  and relies on administrative waivers where statutory amendments are required; (3) M12 lacks privacy-preserving
  payroll mechanics under Ley 58/2003 Art. 95 and LOPDGDD (Ley Orgánica 3/2018), omits an explicit
  inembargabilidad and anti-offset shield (Art. 607 LEC, Art. 44 TRLGSS, Arts. 71-73 LGT), and omits
  GDPR Art. 22 / Ley 39/2015 Art. 41 safeguards against automated benefit suspension; and (4) M13's
  24-36 month residency waiting period (R2) and fractional accrual (R3) contradict M03's abolition of
  the IRPF mínimo personal y familiar, unconstitutionally taxing first- and second-year legal resident
  workers from their first euro without a subsistence floor in violation of Art. 31.1 CE and EU worker
  non-discrimination law.
scores:
  spain_fit:
    score: 3.2
    rationale: >-
      Accurately incorporates core constitutional articles (Arts. 14, 31, 41, 148.1.20, 149.1.1, 149.1.14,
      149.1.17 CE), LOFCA, IRPF, and IMV, and distinguishes common vs. foral regimes, but cites unindexed
      and inaccurate TC case numbers in M06 instead of STC 158/2021 and STC 19/2024, overlooks how IRPF
      integration affects the 50% autonomous IRPF tariff ceded under Ley 22/2009 and the Basque Concierto
      Económico (Ley 12/2002), and misapplies Annex X of EU Regulation 883/2004 to an unconditional transfer.
  feasibility:
    score: 3.0
    rationale: >-
      Identifies the core administrative registries (AEAT, INSS, Padrón Continuo), but underestimates legal
      and technical constraints: M12's Net-Withholding Mode via employer payrolls (Modelo 111/190) risks
      exposing protected employee vulnerability data without a zero-knowledge withholding protocol under
      LGT Art. 95 and LOPDGDD; M07 assumes administrative agencies can waive benefit means-testing in pilots
      without statutory reform; and M12/M13 Section 6 do not disaggregate Municipal, Regional (Común vs.
      Foral), and National pilot mechanics.
  ethics_equity:
    score: 3.3
    rationale: >-
      Includes a No-Loser Guarantee (M07), individual payment autonomy (M14), and last-mile inclusion via
      Correos basic accounts (M12), but creates two severe legal-equity traps: (1) M13's 24-36 month waiting
      period combined with M03's repeal of the IRPF mínimo personal taxes recent legal resident workers at
      38-52% from their first euro of subsistence income (violating Art. 31.1 CE), and (2) M07's absorption
      of SEPE subsidios strips displaced workers aged 52+ of their state-paid retirement pension contributions
      under Art. 280 TRLGSS.
  counterarguments:
    score: 3.1
    rationale: >-
      Addresses headline objections (Cupo disputes, ghost Padrón registrations, welfare-magnet claims),
      but misses critical legal counterarguments: CJEU invalidation of Annex X SNCB status for universal
      unconditional benefits, commercial bank and AEAT automatic debt set-offs (compensación de oficio)
      seizing UBR transfers absent an Art. 607 LEC / Art. 44 TRLGSS shield, and fundamental-rights challenges
      under GDPR Art. 22 and Ley 39/2015 Art. 41 against algorithmic suspension of benefits.
  coverage:
    score: 3.2
    rationale: >-
      Covers reference factors F07, F08, F13, and F14 at a foundational level, but M06, M07, and M12 fail
      to operationalize how legal competences, contributory benefit offsets, and administrative clearing
      evolve across AI scenarios S1, S2, and S3 (D-006), and M12 and M13 Section 6 omit explicit three-tier
      pilot comparisons (D-005).
issues:
  - id: LW-01-01
    severity: critical
    module: M06
    finding: >-
      M06 has three doctrinal flaws and omits S1-S3 scenario differentiation (D-006). First, RQ-M06-02
      proposes classifying UBR as an Annex X "special non-contributory cash benefit" (SNCB) under Regulation
      (EC) No 883/2004. However, Art. 70(2) of Regulation 883/2004 and settled CJEU jurisprudence restrict
      Annex X SNCBs to means-tested benefits linked to Art. 3(1) social security risks or disability
      protection; an unconditional universal transfer cannot legally be sheltered in Annex X. Moreover,
      under Art. 45 TFEU and Art. 24(1) of Directive 2004/38/EC, EU workers and self-employed persons in
      Spain enjoy immediate equal treatment in tax credits and social advantages from Day 1, making a blanket
      24-36 month waiting period unlawful if applied to economically active EU citizens. Second, M06 cites
      inaccurate TC case numbers in prose ("STC 19/2022, STC 62/2022") without sources.yaml entries instead
      of the actual Tribunal Constitucional rulings on IMV competence (STC 158/2021 on RDL 20/2020 and
      STC 19/2024 on Ley 19/2021 foral management transfers), and fails to specify how abolishing the IRPF
      mínimo personal affects the 50% regional IRPF tranche under Ley 22/2009 and the Basque Concierto
      Económico (Ley 12/2002). Third, M06 does not distinguish legal anchors across S1, S2, and S3.
    proposal: >-
      Revise M06 to: (1) replace the Annex X SNCB claim with a bifurcated EU-law architecture distinguishing
      economically active EU workers/self-employed (entitled to immediate pro-rata IRPF tax-transfer
      integration under Art. 45 TFEU and Art. 24(1) Directive 2004/38/EC) from economically inactive EU
      citizens and third-country nationals (governed by Art. 7(1)(b) and Art. 24(2) Directive 2004/38/EC
      and Ley Orgánica 4/2000 prior to 5-year permanent residence); (2) add verified citations to STC 158/2021,
      STC 19/2024, Ley 22/2009, and Ley 12/2002, specifying the LOFCA / Ley 22/2009 compensation mechanism
      to preserve Autonomous Communities' 50% IRPF fiscal autonomy; and (3) map constitutional anchors
      across S1 (Arts. 149.1.14 and 149.1.17 CE), S2 (LOFCA Art. 157.3 CE rebalancing as labor IRPF erodes),
      and S3 (Art. 128.2 CE public initiative and sovereign wealth dividend charter).
    sources:
      - title: "Pleno. Sentencia 158/2021, de 16 de septiembre de 2021. Recurso de inconstitucionalidad 1140-2021 (Ingreso Mínimo Vital, BOE-A-2021-17107)"
        authors: ["Tribunal Constitucional"]
        year: 2021
        url: "https://www.boe.es/buscar/doc.php?id=BOE-A-2021-17107"
      - title: "Pleno. Sentencia 19/2024, de 31 de enero de 2024. Recurso de inconstitucionalidad 1937-2022 (Gestión foral del Ingreso Mínimo Vital, BOE-A-2024-3941)"
        authors: ["Tribunal Constitucional"]
        year: 2024
        url: "https://www.boe.es/buscar/doc.php?id=BOE-A-2024-3941"
      - title: "Ley 22/2009, de 18 de diciembre, por la que se regula el sistema de financiación de las Comunidades Autónomas de régimen común (BOE-A-2009-20375)"
        authors: ["Jefatura del Estado"]
        year: 2009
        url: "https://www.boe.es/buscar/act.php?id=BOE-A-2009-20375"
      - title: "Ley 12/2002, de 23 de mayo, por la que se aprueba el Concierto Económico con la Comunidad Autónoma del País Vasco (BOE-A-2002-9969)"
        authors: ["Jefatura del Estado"]
        year: 2002
        url: "https://www.boe.es/buscar/act.php?id=BOE-A-2002-9969"
      - title: "Directive 2004/38/EC of the European Parliament and of the Council of 29 April 2004 on the right of citizens of the Union and their family members to move and reside freely"
        authors: ["European Parliament and Council"]
        year: 2004
