reviewer: red-team
iteration: 2
summary: >-
  Adversarial referee audit of Iteration 2 (iter-0002) identifies two critical and four major structural flaws:
  (1) a fundamental macro-micro arithmetic chasm between M01's 11.55% of GDP baseline tax revenue collapse under S2 and
  M03's static assumption of status-quo budget neutrality at the 82nd-86th percentile with 38-52% IRPF rates; (2) an
  experimental identification failure in M10 where the benefit clawback arm phases out to zero for workers earning above
  28k EUR and urban census tracts violate SUTVA due to spatial boundary leakage; (3) anachronistic citation-claim
  mismatches citing a 2019 Basque study for post-2021 IMV operational failures while omitting official AIReF reports;
  (4) an irreconcilable contradiction in M16 between origin-based Net Operating Surplus taxation and capturing foreign AI
  monopoly rents, alongside an order-of-magnitude shortfall in Sovereign Dividend Fund yields; (5) unaddressed CJEU
  cross-border exportability under Regulation 883/2004 and discrimination against non-resident EU workers under the Schumacker
  doctrine; and (6) an operational fallacy relying on 4-7 year public housing construction as a short-run rent circuit-breaker.
scores:
  counterarguments:
    score: 3.4
    rationale: >-
      Counterarguments were broadened across modules but continue to evade steel-manned critiques regarding how a
      collapsed labor tax base under S2/S3 can simultaneously fund baseline public services and UBR, the 4-7 year lag
      of housing construction circuit breakers, and EU exportability under Regulation 883/2004.
  internal_coherence:
    score: 3.1
    rationale: >-
      While terminology and child equivalence weights are harmonized, massive quantitative disconnects remain between
      M01 baseline tax erosion (11.55% of GDP in S2) and M03 revenue-neutral breakeven, alongside sovereign fund payout
      lag and origin vs destination corporate tax confusion in M16.
  methodological_rigor:
    score: 3.2
    rationale: >-
      Expanding M10 to J=70 clusters improves power, but using 2-3 block urban census tracts violates SUTVA and invalidates
      rent pass-through estimates; furthermore, the randomized clawback arm phases out to zero for workers earning above
      28k EUR, failing to identify substitution elasticities across middle/upper deciles.
  feasibility:
    score: 3.2
    rationale: >-
      Administrative registries are well specified, but M10 contains internal budget math contradictions (480M EUR vs
      648M EUR gross), assumes frictionless capture of 1.5-2.0B EUR in regional minimum income savings despite LOFCA
      barriers, and relies on public housing construction as a short-run rent circuit-breaker.
  evidence_grounding:
    score: 3.3
    rationale: >-
      All cited keys exist in sources.yaml, but severe citation-claim mismatches and anachronisms undermine credibility:
      De la Rica & Gorjon (2019) is repeatedly cited for post-2021 IMV failure, AIReF official evaluation reports are
      missing, and OpenResearch health findings are distorted into permanent cost reductions.
issues:
  - id: RT-02-01
    severity: critical
    module: GLOBAL
    finding: >-
      A fatal arithmetic and parameter contradiction exists between M01's macroeconomic scenario projections and M03's
      micro-tax fiscal bridge. In M01 (RQ-M01-02), a 7.0 pp drop in the labor income share under S2 contracts combined
      IRPF and Social Security revenues by >1.65 pp per 1 pp labor share loss—eroding baseline tax receipts by 11.55%
      of GDP (~173B EUR/year in 2026 euros) in S2 and 24.7% of GDP in S3. Yet M03 (RQ-M03-01) calculates its revenue-neutral
      IRPF schedule assuming that 100% of baseline pre-reform public services (~125B EUR/year) remain fully funded from
      the existing wage base, that Tier B gross outlays (466B EUR) require only 4.8–6.2% of GDP in net financing, and
      that breakeven occurs at the 82nd–86th percentile (38,000–44,000 EUR) under a 38–52% marginal rate schedule.
      This is mathematically impossible: under S2, the national wage bill contracts from ~47% to ~40% of GDP (~600B EUR
      total taxable earnings). Even taxing 100% of all Spanish labor income at an average rate of 45% yields only 270B
      EUR—which leaves just 145B EUR after maintaining baseline public services, facing 466B EUR in gross UBR outlays.
      Meanwhile, M16 generates only 0.9–1.2% of GDP net new revenue under S2 after deducting employer payroll contribution
      losses. M03 simply ran EUROMOD on a static, pre-AI labor income distribution, completely failing to incorporate
      M01's baseline revenue collapse.
    proposal: >-
      Close the macro-micro feedback loop across M01, M03, and M04: (1) Force EUROMOD in M03 to run on the counterfactual
      post-displacement wage and employment distributions generated by M01/HANK across S1, S2, and S3, rather than the
      unadjusted 2024 Panel de Hogares / ECV; (2) Explicitly account for the 11.55% of GDP baseline revenue loss in the
      Administraciones Públicas fiscal bridge, recognizing that status-quo budget neutrality under S2/S3 requires either
      deep restructuring of public spending, substantial capital/consumption tax increases, or dynamic macro-indexed
      benefit modulation.
    sources:
      - title: The Simple Macroeconomics of AI
        authors:
          - Acemoglu, D.
        year: 2024
        doi: 10.1093/epolic/eiae042
      - title: Universal Basic Income in the United States and Advanced Countries
        authors:
          - Hoynes, H.
          - Rothstein, J.
        year: 2019
        doi: 10.1146/annurev-economics-080218-030237
      - title: Scenarios for the Transition to AGI
        authors:
          - Korinek, A.
          - Suh, D.
        year: 2024
        doi: 10.3386/w32255

  - id: RT-02-02
    severity: critical
    module: M10
    finding: >-
      M10's experimental design in RQ-M10-01, RQ-M10-02, and Section 5 contains two fatal econometric identification
      flaws. First, the randomized clawback arm (Arms B & C: phasing out 900 EUR/month at 38% and 50% of gross earnings
      bounded at zero) completely phases out to zero net transfer for any individual earning above 28,421 EUR/year (Arm B)
      or 21,600 EUR/year (Arm C). For the majority of full-time workers and higher-income deciles (deciles 6–10), the net
      grant is zero and the marginal clawback is zero; they face exactly the same statutory IRPF schedule and income as
      the control group. Consequently, this arm provides zero experimental variation in marginal net wages or income for
      earners above 28,421 EUR, making it mathematically impossible to identify compensated substitution elasticities
      or income elasticities across the earned-income distribution as claimed in RQ-M10-02. It merely tests a means-tested
      benefit on low-income workers. Second, defining spatial saturation clusters as census tracts (secciones censales,
      ~1,000–1,500 residents) across 4 metropolitan provinces violates the Stable Unit Treatment Value Assumption (SUTVA):
      an urban census tract in Madrid or Barcelona is an open boundary of 2–3 city blocks. Saturating 80% of residents
      in 2 blocks while control residents live across the street causes severe spatial leakage, local price spillovers,
      and residential relocation across tract borders, destroying causal identification of local general-equilibrium
      rental pass-through (M05) and service multipliers (M04).
    proposal: >-
      In M10, (1) Replace the truncated grant phase-out arm with a design that creates valid experimental variation
      across all income deciles: either test non-linear refundable tax credit schedules paired with randomized lumpsum
      endowments, or explicitly acknowledge that marginal tax responses above median earnings must be estimated
      quasi-experimentally via administrative IRPF bunching and tax reforms (M08) rather than extrapolated from a low-income
      clawback arm; (2) Redefine spatial clusters from narrow, porous urban census tracts to bounded labor/housing market
      areas or geographically separated small municipalities with mandatory spatial buffer (donut) zones to prevent
      cross-border contamination and satisfy SUTVA.
    sources:
      - title: "General Equilibrium Effects of Cash Transfers: Experimental Evidence from Kenya"
        authors:
          - Egger, D.
          - Haushofer, J.
          - Miguel, E.
          - Niehaus, P.
          - Walker, M.
        year: 2022
        doi: 10.3982/ECTA17945
      - title: "Optimal Income Transfer Programs: Intensive versus Extensive Labor Supply Responses"
        authors:
          - Saez, E.
        year: 2002
        doi: 10.1162/003355302760193959

  - id: RT-02-03
    severity: major
    module: M12
    finding: >-
      Across 00-scope (Section 2, line 78), M07 (Section 3, line 482), M09 (Section 3, line 580), and M12 (Section 1,
      line 740; Section 3, line 751), the research plan repeatedly cites [@boe-imv-2021; @arcelus-bade-2015-rgi] to support
      the empirical claims that official evaluations show over 50% of eligible households in severe poverty never receive
      IMV and that recipients suffer from devastating retrospective debt recovery notices (cobros indebidos). This
      represents a severe citation-claim mismatch and anachronism. boe-imv-2021 is Ley 19/2021 itself—a legislative
      statute that cannot provide an empirical evaluation of its own operational non-take-up or administrative errors.
      Meanwhile, arcelus-bade-2015-rgi is a 2019 academic paper by Sara De la Rica and Lucía Gorjón analyzing the Basque
      Country regional RGI using 2015 microdata; it was published two full years before the IMV was enacted and contains
      zero empirical data on the IMV, national non-take-up rates, or cobros indebidos. The definitive official empirical
      evaluations documenting the >50% non-take-up rate, bureaucratic paralysis, and retrospective debt clawbacks were
      conducted by AIReF in its annual statutory IMV Opinions (2022–2024), which are completely missing from plan/sources.yaml.
    proposal: >-
      Remove arcelus-bade-2015-rgi from all empirical claims regarding the IMV. Register AIReF official evaluations
      (Segunda Opinión sobre el Ingreso Mínimo Vital, 2023) in plan/sources.yaml with verified institutional URLs, and cite
      AIReF directly in 00-scope, M07, M09, and M12 for IMV non-take-up, administrative delays, and retrospective debt
      adjustments.
    sources:
      - title: Segunda Opinión sobre el Ingreso Mínimo Vital
        authors:
          - AIReF
        year: 2023
        url: https://www.airef.es/es/segunda-opinion-sobre-el-ingreso-minimo-vital/
      - title: "Assessing the impact of a minimum income scheme: the Basque Country case"
        authors:
          - De la Rica, S.
          - Gorjón, L.
        year: 2019
        doi: 10.1007/s13209-019-00203-2
      - title: Ley 19/2021, de 20 de diciembre, por la que se establece el ingreso mínimo vital (BOE-A-2021-21007)
        authors:
          - Jefatura del Estado
        year: 2021
        url: https://www.boe.es/buscar/act.php?id=BOE-A-2021-21007

  - id: RT-02-04
    severity: major
    module: M16
    finding: >-
      M16 contains a structural contradiction regarding cross-border AI rents and an order-of-magnitude disconnect in
      sovereign wealth fund financing. In Section 1, M16 correctly notes that frontier generative AI foundation models are
      foreign multinationals (US/China) and calls for destination-based corporate instruments. However, RQ-M16-01 and
      Section 5.1 propose taxing domestic Net Operating Surplus (EBE minus depreciation) modeled on Italian IRAP (CJEU Case
      C-475/03 Banca Popolare di Cremona). An origin-based tax on domestic net operating surplus falls exclusively on
      Spanish firms; when Spanish firms purchase US AI cloud APIs, foundation models, and compute, that expenditure is an
      imported intermediate input that reduces domestic operating surplus, allowing foreign monopoly AI rents to escape
      Spanish taxation entirely. The only destination instrument cited—the Spanish Digital Services Tax (Ley 4/2020, Tasa
      Google)—yields <300M EUR/year (<0.02% of GDP) and explicitly excludes B2B enterprise SaaS, cloud hosting, and foundation
      model APIs. Furthermore, RQ-M16-03 projects that saving 1.0–1.2% of GDP annually builds an endowment of 15–20% of GDP
      by Year 15, yielding a 4% real dividend payout of 0.5–0.8% of GDP/year. Yet 00-scope and M16 present this fund as the
      primary co-financing pillar for Tier C (1,200 EUR/month, S3 target), which has a gross outlay of 622B EUR/year (41.5%
      of GDP) and a net financing need >15% of GDP. An annual payout of 0.5–0.8% of GDP covers less than 5% of Tier C net
      cost, exposing AI-dividend financing as wishful rhetoric.
    proposal: >-
      In M16, (1) Resolve the origin-vs-destination contradiction: admit that the IRAP-style Net Operating Surplus
      contribution taxes domestic corporate adopters of automation rather than foreign AI developers, and design an
      explicit Destination-Based Cash Flow Tax (DBCFT) component or compute import excise to capture foreign cloud/API
      rents; (2) Re-calibrate the fiscal claims of the Sovereign Dividend Fund: clarify across 00-scope, M03, and M16 that
      the fund is a partial intergenerational buffer whose 0.5–0.8% GDP yield cannot fund Tier C, requiring the research
      plan to specify the current annual tax base that finances the remaining 95% of Tier C.
    sources:
      - title: CJEU Case C-475/03 Banca Popolare di Cremona (IRAP Directive Compatibility)
        authors:
          - Court of Justice of the European Union
        year: 2006
        url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62003CJ0475
      - title: Should Robots Be Taxed?
        authors:
          - Guerreiro, J.
          - Rebelo, S.
          - Teles, P.
        year: 2022
        doi: 10.1093/restud/rdab019
      - title: Scenarios for the Transition to AGI
        authors:
          - Korinek, A.
          - Suh, D.
        year: 2024
        doi: 10.3386/w32255

  - id: RT-02-05
    severity: major
    module: M06
    finding: >-
      M06 (RQ-M06-02) and M13 (RQ-M13-02) leave critical legal holes under European Union law. First, M06 acknowledges that
      an unconditional UBR cannot be classified as an Annex X special non-contributory cash benefit under Regulation (EC)
      No 883/2004, but claims that a bifurcated EU-law architecture will prevent mandatory cross-border exportability before
      the CJEU. Under Article 7 of Regulation 883/2004, if a cash benefit falls within the scope of social security legislation
      and is not listed in Annex X, residence conditions are waived—meaning qualifying beneficiaries could export their
      900 EUR/month payment when moving to another EU Member State. Second, M13 Tax-Benefit Symmetry principle restricts
      the UBR refundable credit to residents subject to IRPF under Art. 9 LIRPF (>183 days residence), while subjecting
      inactive non-nationals to a 24-month waiting period. This completely overlooks frontier and seasonal EU workers who
      reside in Spain for <183 days: they are taxed under the Non-Resident Income Tax (IRNR) without personal allowances. If
      Spain repeals the IRPF mínimo personal and replaces it with a UBR credit denied to non-resident EU workers, this directly
      infringes Article 45 TFEU and landmark CJEU jurisprudence (Finanzamt Köln-Altstadt v Schumacker, Case C-279/93), which
      prohibits denying tax relief and family allowances to non-resident EU workers who obtain the major part of their
      taxable income in the host Member State.
    proposal: >-
      In M06 and M13, (1) Provide a rigorous legal solution to the Regulation 883/2004 exportability dilemma: evaluate
      whether the non-contributory cash component must be statutory anchored as general social assistance governed strictly
      by Directive 2004/38/EC (falling outside Regulation 883/2004 Art. 3 material scope), or if a formal Annex X coordination
      exemption must be negotiated; (2) Extend the Tax-Benefit Symmetry architecture in M06 and M13 to seasonal and frontier
      EU workers subject to Ley del IRNR, ensuring compliance with the CJEU Schumacker doctrine.
    sources:
      - title: CJEU Case C-279/93 Schumacker (Equal Treatment for Non-Resident EU Workers)
        authors:
          - Court of Justice of the European Union
        year: 1995
        url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:61993CJ0279
      - title: Regulation (EC) No 883/2004 on the coordination of social security systems
        authors:
          - European Parliament and Council
        year: 2004
        url: https://eur-lex.europa.eu/eli/reg/2004/883/oj
      - title: Directive 2004/38/EC on the right of citizens of the Union to move and reside freely
        authors:
          - European Parliament and Council
        year: 2004
        url: https://eur-lex.europa.eu/eli/dir/2004/38/oj

  - id: RT-02-06
    severity: minor
    module: M05
    finding: >-
      M05 (Section 6) and M17 (Section 5.3) propose an automatic statutory circuit-breaker that redirects nominal UBR step-ups
      into public social housing construction (parque público) if urban rental pass-through exceeds 20%. This mechanism
      suffers from severe temporal mismatch and territorial distortion. First, public housing development in Spain—encompassing
      urban planning, municipal zoning, licensing, public procurement under Ley 9/2017 de Contratos del Sector Público, and
      physical construction—requires 4 to 7 years from budgeting to occupancy. Redirecting current cash flows into public
      housing construction cannot stabilize short-run rental inflation or compensate tenants currently facing landlord rent
      extraction. Second, rent pass-through is localized in supply-inelastic metropolitan areas (Madrid, Barcelona, Balearic
      Islands), whereas rural and small municipalities exhibit <5% pass-through (RQ-M05-01). Pausing or diverting national
      UBR benefit increases across all 48 million residents because rents rise in Madrid or Barcelona imposes an unjustified
      welfare penalty on low-income populations in España vaciada where housing supply is elastic and costs are low.
    proposal: >-
      Decouple the macroeconomic UBR circuit-breaker from physical housing construction: (1) Replace physical building
      triggers with immediate, localized regulatory and fiscal stabilizers under Ley 12/2023 (such as municipal vacant-property
      IBI surcharges, emergency tenant tax credits, and commercial-to-residential conversion mandates); (2) Ensure that
      any national cash stabilization rules operate via macro tax surcharges (e.g. M17 upper-bracket IRPF stabilizer) rather
      than freezing basic subsistence payments in non-stressed rural provinces.
    sources:
      - title: Ley 12/2023, de 24 de mayo, por el derecho a la vivienda (BOE-A-2023-12203)
        authors:
          - Jefatura del Estado
        year: 2023
        url: https://www.boe.es/buscar/act.php?id=BOE-A-2023-12203
      - title: Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público (BOE-A-2017-12902)
        authors:
          - Jefatura del Estado
        year: 2017
        url: https://www.boe.es/buscar/act.php?id=BOE-A-2017-12902
      - title: "The Effects of Rent Control Expansion on Tenants, Landlords, and Inequality: Evidence from San Francisco"
        authors:
          - Diamond, R.
          - McQuade, T.
          - Qian, F.
        year: 2019
        doi: 10.1257/aer.20181289
